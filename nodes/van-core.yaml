# van-core - the node the whole project exists for.
#
# Holds the BLE link to the P310, the fridge probe, the AC arbiter, the manual
# cooking button and the SoftAP everything else joins. Fridge control is
# entirely local to this node and never reads the network (CLAUDE.md section 5.1).
#
# Board: Waveshare ESP32-S3-LCD-1.47B (ESP32-S3R8, 8MB PSRAM, 16MB flash).
# THE B VARIANT - `VERIFIED 2026-08-30` against the vendor schematic
# (files.waveshare.com/wiki/ESP32-S3-LCD-1.47B/). Almost the non-B pinout, with
# three differences that cost half a day of black screen:
#   - LCD_BL is GPIO46 (active high, SI2302 low-side on LEDK), NOT GPIO48
#   - IO47/IO48 are the onboard QMI8658 IMU's I2C bus - do not repurpose
#   - there is a battery charger (ETA6098) and BAT_ADC on IO1
#
# BEFORE THIS GOES IN THE VAN: run nodes/van-core-soak.yaml for 24h.
# BEFORE EVERY TRIP: pull the BLE antenna, unplug the probe, confirm AC ends ON.
#
# LOG: every 10 s into a PSRAM ring (download at /soak) and, from there, onto
# the microSD card as one CSV per local day under /log (browse at /file). The
# card copy survives power cuts; the ring bridges a missing or failing card for
# ~4 days. Clock: the phone sets it whenever /ui or /soak is opened - there is
# no RTC yet, so rows before the first page load after a power cut land in
# /log/noclock-bootN.csv (still with uptime_s, so they can be re-timed).

substitutions:
  node_name: van-core
  friendly_name: Van core
  # POWER-0183, found by tools/fbot_probe.py scan on 2026-08-18.
  p310_mac: "E8:06:90:C7:AD:F6"

  # --- pins: display (onboard, plain SPI ST7789) ---
  pin_lcd_sclk: GPIO40
  pin_lcd_mosi: GPIO45
  pin_lcd_cs: GPIO42
  pin_lcd_dc: GPIO41
  pin_lcd_rst: GPIO39
  # GPIO46 is a strapping pin; fine as an output after boot, override below.
  pin_lcd_bl: GPIO46

  # --- pins: external wiring, all on 3.5mm pluggable screw terminals ---
  # Connectors are keyed by pin count so they cannot be mis-plugged at 11pm in
  # a car park: 2-pin = 12V in, 3-pin = 1-Wire, 4-pin = button+LED.
  # GPIO4 and GPIO5 `VERIFIED 2026-10-15` on the bench with
  # van-core-inputs.yaml: a DS18B20 on 4, the button between 5 and GND (M22).
  pin_onewire: GPIO4
  # The two probes are pinned by 1-Wire address (M14), so a probe that is not
  # listed here is found on the bus and ignored - van-core then sees no fridge
  # probe and holds AC on. These are the van's. A bench build with another
  # probe overrides them (van-core-pcsim.yaml) rather than editing these.
  fridge_probe: "0xf50e250267176c28"
  cabin_probe: "0x600e2502e02beb28"
  # THE ONLY BUTTON (D-30). Short press = screen, hold = AC. GPIO6/7 are no
  # longer used: the bezel page and sleep buttons are gone, sleep and parked
  # mode live in the web UI.
  pin_btn: GPIO5
  # The button's own LED, if the button fitted is an illuminated one. Driven
  # with the same colours as the status LED below; harmless if not wired.
  pin_led_r: GPIO9
  pin_led_g: GPIO10
  pin_led_b: GPIO11
  # The board's own WS2812 (LED2): the status light that works with the screen
  # off (D-34). `VERIFIED` on GPIO38 (M22); RGB order, not the WS2812B's usual
  # GRB (`MEASURED 2026-10-15`: parked red showed green). No buzzer is fitted or planned,
  # so GPIO8 is free and every cue that used to be a chirp is a light.
  pin_status_led: GPIO38
  # GPIO0 (BOOT) is NOT used as a runtime button: it is a strapping pin, and
  # holding it across a reset silently drops the board into download mode.
  # It is also hard to reach in the enclosure. GPIO6/7 are free again.

  # --- BENCH REVIEW. SET TO 0 BEFORE THIS GOES IN THE VAN. ---
  # 1 pins the backlight on and auto-cycles the pages, so the panel can be
  # reviewed on a bare board with no button wired. Both behaviours are
  # WRONG in the van: a page that changes under you while you are reading it is
  # exactly the animation section 2 forbids, and a backlight that never blanks
  # is a night-light burning the pack. Grep `bench_review` - there are two
  # call sites and they both say so.
  bench_review: "0"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "AC arbiter, P310 BLE link, fridge control"
  # Pin the toolchain. A routine ESPHome update must not invalidate a working
  # config two days before a trip (CLAUDE.md section 11).
  min_version: 2025.7.0
  # vc_draw.h: anti-aliased shapes ESPHome lacks (shared with the bench rig).
  # vc_panel.h: every screen, drawn from a plain struct - the same file
  # tools/panel_preview/ compiles on a laptop to render them as PNGs (D-36).
  includes:
    - vc_draw.h
    - vc_panel.h
    # Push one strip of the framebuffer to the glass: the hold bar's fast path.
    - vc_flush.h
    - soak_includes.h
    # Synthetic panel data for design review. BENCH ONLY, and display-only -
    # it never reaches the arbiter. See the banner in the file itself.
    - vc_demo.h
  on_boot:
    # Priority 800 is before almost everything else. The arbiter's own setup()
    # already commands AC ON; this is the belt to that braces.
    - priority: 800
      then:
        - logger.log: "van-core boot: AC held ON until the arbiter says otherwise"
    # Priority -100: last of all, after ac_arbiter's own setup() has already
    # commanded AC ON. Restoring parked mode is the one thing allowed to undo
    # that, and it must be explicit rather than a side effect of switch restore
    # semantics - a van meant to stay parked for three weeks must not un-park
    # itself because a brownout rebooted the node.
    - priority: -100
      then:
        - if:
            condition:
              lambda: return id(parked_saved);
            then:
              - lambda: id(arbiter)->set_parked(true);
              - logger.log:
                  level: WARN
                  format: "van-core boot: PARKED restored - AC held OFF, fail-safe disarmed"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    # esp-idf, matching the ESP-FBot examples. sd_mmc_card builds under it too
    # (van-core-soak.yaml settled that).
    type: esp-idf
    advanced:
      # Required by sd_mmc_card: the real VFS, and fatfs linked in explicitly.
      include_builtin_idf_components: ["fatfs", "spiffs"]
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_FATFS_LFN_STACK: "y"
      # `ADDED 2026-10-13`, D-29, M20. ESPHome sized this at its floor of 10
      # from what its components declare, but httpd alone may hold 7 client
      # sessions plus its listener and its control socket, and nobody counted
      # soak_log's plug poller or the OTA upload's own connection. Once httpd
      # was full, those two were refused - which is how a flash failed with
      # "closed the connection during handshake". 16 = 9 httpd + OTA listener
      # and upload + plug poller + 2 Wi-Fi internals, and 2 spare. Each slot
      # is a few hundred bytes until used; net_guard's "Open sockets" shows
      # how close to it the node runs.
      CONFIG_LWIP_MAX_SOCKETS: "16"
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz
  # Must be false: the log's noinit PSRAM section is incompatible with "boot
  # without PSRAM" (IDF Kconfig SPIRAM_IGNORE_NOTFOUND).
  ignore_not_found: false

packages:
  base: !include ../common/base.yaml

external_components:
  # The arbiter (pure state machine, host-tested in test/), the log, the UI,
  # and the socket guard (D-29). web_server_idf here REPLACES ESPHome's own:
  # it is 2026.8.0's, with the fix for stuck event streams that upstream
  # shipped in 2026.10 - see components/web_server_idf/README.md, and delete
  # it from this list when ESPHome moves past 2026.10.
  #
  # fbot is ESP-FBot - the P310 BLE protocol, already solved, and the whole
  # reason this project is ESPHome rather than custom firmware (Apache-2.0).
  # `CHANGED 2026-10-15` (D-32): a vendored copy of the commit this config used
  # to pin from GitHub (2b22754e, upstream HEAD since 2026-04-18), with three
  # marked fixes found on the laptop test rig (M23): notifications were never
  # switched on, a station that never answered was never timed out, and one
  # that went quiet for ~45 s wedged the link until a reboot. Details in
  # components/fbot/README.md. Moving to a newer upstream means re-applying
  # those three, after reading and bench-testing it (CLAUDE.md section 11).
  - source:
      type: local
      path: ../components
    components: [ac_arbiter, soak_log, van_ui, net_guard, web_server_idf, fbot]
  # Mounts the card and serves /file. soak_log does the writing, off the main
  # loop; this component's own write actions block it and are not used.
  #
  # `CHECKED 2026-09-30`: ESPHOME MUST STAY BELOW 2026.9.0 while this is in
  # the build. sd_file_server.cpp still calls AsyncWebServerRequest::url(),
  # which 2026.9.0 removed - 2026.8.x compiles it with deprecation warnings,
  # 2026.9.x does not compile it at all. No fix upstream: main is still v0.2.0
  # (889073e, 2026-03-12), and issue #41 reporting exactly this has had no
  # reply since 2026-07-09. Pinned to that commit so a push upstream cannot
  # change a build that works; a SHA cannot move, hence `refresh: never`. To
  # go past 2026.8, point `ref` at a fixed commit or vendor sd_file_server
  # into components/ (MIT) with the url_to() change van_ui and soak_log carry.
  - source:
      type: git
      url: https://github.com/n-serrette/esphome_sd_card
      ref: 889073e052275aeb9e826b697efe3bbbe09f935d
    components: [sd_mmc_card, sd_file_server]
    refresh: never

# -----------------------------------------------------------------------------
# Network. SoftAP only - no router exists in the van, and no station mode is
# configured on purpose so this node cannot sit there scanning for a network
# that is not there.
# -----------------------------------------------------------------------------
wifi:
  ap:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
  # `TODO/VERIFY`: CLAUDE.md section 4 wants max_connection raised to 8. ESPHome
  # exposes no YAML key for the SoftAP max_connection; it is set in the wifi
  # component. With phone + water + heater + vehicle the default is already met.
  # Settle this before adding the fourth client, not after.

# captive_portal is DELIBERATELY ABSENT. Two independent reasons, both measured:
#
# 1. `MEASURED 2026-08-30`: with it enabled, a phone could see this AP and
#    never complete the WPA2 4-way handshake - "saved, connection failure".
#    esphome/components/wifi/wifi_component.cpp:722-731: on an AP-ONLY node
#    with captive_portal present, ESPHome puts the radio into AP+STA and calls
#    start_scanning(), and that STA_SCANNING state overwrites the AP state set
#    a few lines earlier. The node then scans channels forever while trying to
#    hold an AP on one. Removing it, with nothing else changed, made the phone
#    join first time and the web UI load.
# 2. `MEASURED 2026-08-24` (van-core-ttgo.yaml): it registers a catch-all
#    handler and wins "/", serving a wifi-provisioning scan list instead of
#    the UI - on a node that has no station mode and no credentials to
#    provision, i.e. offering an action that must never be taken.
#
# van_ui's `captive_landing: true` already answers the phone's connectivity
# probe with the landing page, which is all captive_portal was wanted for.

# -----------------------------------------------------------------------------
# P310 over BLE
# -----------------------------------------------------------------------------
# `scan_parameters.window` is set EXPLICITLY and must stay that way.
#
# ESPHome 2026.8.0 raises a *defaulted* scan window to equal the interval
# whenever software coexistence is compiled in and IDF >= 5.5.5 - see
# esp32_ble_tracker/__init__.py, _raise_defaulted_scan_window(). The default
# build therefore compiles to 320ms/320ms: a 100% duty-cycle BLE scan, on the
# theory that "BLE uses the airtime wifi does not claim".
#
# That theory does not survive contact with SoftAP. `MEASURED 2026-08-23`
# (measurements.md M9, on the TTGO rig): with the full-duty scan running, a
# phone could see the AP but every join ended in "saved, connection failure" -
# the WPA2 4-way handshake never completed. `REPRODUCED 2026-08-30` on this
# board, where it was worse: the AP did not even appear in a laptop scan while
# the P310 was out of range and the tracker was hunting for it continuously.
#
# The failure is worst exactly when it hurts most: BLE down is the fault the
# web UI exists to diagnose, and that is the state in which the tracker scans
# hardest and the UI disappears.
#
# 30ms/320ms is ~9% duty. A user-set window is never touched by the code above,
# so setting it here opts out of the aggressive default. Do not delete this key
# to "clean up the config" - it is load-bearing.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms

ble_client:
  - mac_address: ${p310_mac}
    id: p310_ble

fbot:
  id: p310
  polling_interval: 5s           # matches the arbiter tick; no point going faster
  settings_polling_interval: 60s # thresholds change rarely
  # ESP-FBot gives up after max_poll_failures x poll_timeout with no reply
  # (here ~150 s) and, patched (D-32), drops the link so it reconnects. Until
  # then it still accepts writes. It MUST outlast the arbiter's link_stale
  # fail-safe below, or the ON command that fail-safe exists to send is
  # refused - which is exactly what 15 s x 3 = 45 s did (M23). The arbiter
  # fires at sensor_max_age + link_stale + one 5 s tick = 45 + 60 + 5 = 110 s
  # after the last reply; 150 s leaves 40 s for the write and its re-sends.
  # Change any of the four numbers, re-check this inequality.
  poll_timeout: 50s
  max_poll_failures: 3

binary_sensor:
  - platform: fbot
    fbot_id: p310
    connected:
      name: "P310 connected"
      id: p310_connected
    ac_active:
      name: "P310 AC output active"
      id: p310_ac_active
    dc_active:
      name: "P310 DC output active"
      id: p310_dc_active

  # --- the one button (D-30), screen-context holds (D-33) ---
  #
  #   tap   (< 1 s)   screen dark: wake, landing on the main screen
  #                   screen on:   next screen.  NEVER touches AC.
  #   hold  (3 s)     acts the moment it reaches the hold time - no guessing
  #                   when to let go - and does what the SCREEN offers:
  #                     ENERGY / FRIDGE / WATER / DIAG / PARKED view
  #                                   cooking AC: start 45 min, or +30 min
  #                                   (and leaves parked mode, through the switch)
  #                     COOKING       stop cooking (this screen exists only
  #                                   while cooking is on)
  #                     SLEEP         sleep mode on / off
  #                     PARK          park: asks first ("PARK?"), a second
  #                                   hold confirms (D-14); while parked, leaves
  #   let go between 1 s and the hold time: nothing - the way to back out.
  #
  # Screens cycle ENERGY > FRIDGE > WATER > DIAG > (COOKING) > SLEEP > PARK and
  # fall back to ENERGY after "Button back to main after" seconds of quiet, so
  # the next hold is cooking again and an action screen never waits for a
  # stray press. Cooking is never more than one hold away, from any screen,
  # dark or lit: you should not have to page through a UI with a pan heating.
  #
  # A tap is what a glance at the panel costs, so it must not arm the
  # inverter: every glance would otherwise be the ~48 W leak this project
  # exists to remove. While parked a tap only wakes the PARKED view.
  #
  # While held past 0.4 s the panel shows what the hold is about to do, filling
  # as it goes; the status LED flashes when it acts. Every gesture is logged ([button]), so
  # a phantom press is visible. Hold time and the fall-back are app settings.
  - platform: gpio
    name: "Button"
    id: btn_main
    internal: true
    pin:
      number: ${pin_btn}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # 50ms in software rejects both contact bounce and induced transients. The
      # wire is short now, but the box is still a metre from a 3300W inverter,
      # and a phantom hold arms it for 45 min. Both edges filtered by the same
      # amount, so measured durations equal the real press.
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: |-
          // Intent: start timing. A dark screen wakes now, on the main screen;
          // what the press means is decided on release (tap) or at the hold
          // time (hold - see the 100 ms interval).
          const uint32_t now = millis();
          id(btn_press_ms) = now;
          id(btn_input_ms) = now;
          id(btn_hold_fired) = false;
          id(btn_woke) = !id(display_awake);
          if (id(btn_woke)) {
            id(page_idx) = 0;
            id(park_view) = true;
          }
          id(display_awake) = true;
          id(display_wake_ms) = now;
    on_release:
      - lambda: |-
          // Intent: a tap navigates. A hold has already acted while held, and a
          // release between a tap and the hold time is backing out.
          id(btn_input_ms) = millis();
          if (id(btn_hold_fired)) return;
          const uint32_t held = millis() - id(btn_press_ms);
          if (held >= 1000) {
            ESP_LOGI("button", "let go at %.1f s - nothing", held / 1000.0f);
            return;
          }
          if (id(btn_woke)) {
            ESP_LOGI("button", "tap -> wake");
          } else if (id(toast_kind) != 0) {
            // A tap during a toast only dismisses it: the screen it uncovers
            // is the one you were on.
            id(toast_kind) = 0;
            ESP_LOGI("button", "tap -> dismiss");
          } else if (id(arbiter)->parked() && id(park_view)) {
            id(park_view) = false;
            ESP_LOGI("button", "tap -> pages (still parked)");
          } else {
            // COOKING (3) is in the cycle only while there is cooking to stop.
            int p = id(page_idx);
            do { p = (p + 1) % 7; } while (p == 3 && !id(arbiter)->manual_req());
            id(page_idx) = p;
            ESP_LOGI("button", "tap -> screen %d", p);
          }
      - component.update: van_display

  # --- arbiter state, exposed for the web UI and for logging ---
  - platform: template
    name: "AC on"
    id: bs_ac_on
    lambda: return id(arbiter)->ac_on();
  - platform: template
    name: "Force on (fail-safe)"
    id: bs_force_on
    lambda: return id(arbiter)->force_on();
  - platform: template
    name: "Fridge request"
    id: bs_fridge_req
    lambda: return id(arbiter)->fridge_req();
  - platform: template
    name: "Manual request"
    id: bs_manual_req
    lambda: return id(arbiter)->manual_req();
  - platform: template
    name: "Surplus request"
    id: bs_surplus_req
    lambda: return id(arbiter)->surplus_req();
  - platform: template
    name: "Sleep mode active"
    id: bs_sleep
    internal: true
    lambda: return id(sw_sleep_mode).state;
  - platform: template
    name: "Parked"
    id: bs_parked
    lambda: return id(arbiter)->parked();

sensor:
  - platform: fbot
    fbot_id: p310
    battery_level:
      name: "Battery"
      id: battery_percent
    input_power:
      name: "Input power"
      id: input_watts
    output_power:
      name: "Output power"
      id: output_watts
    system_power:
      name: "System power"
      id: system_watts
    ac_input_power:
      name: "AC input power"
      id: ac_input_watts
    dc_input_power:
      name: "Solar input power"
      id: dc_input_watts
    total_power:
      # Reg 20: AC output only (M1). output_power - this = the 12 V + USB load.
      name: "AC output power"
      id: ac_output_watts
    remaining_time:
      name: "Remaining minutes"
      id: remaining_minutes
    ac_out_voltage:
      name: "AC output voltage"
    # Input reg 2, a level 1-5. On the P310 this is believed to be the AC
    # input knob position - UNVERIFIED, check with fbot_probe.py at two or
    # three knob positions. ESP-FBot publishes it as 300..1100 W (another
    # Fbot model's table), so undo that and relabel with the P310's knob.
    # Display only: nothing reads this for a control decision.
    charge_level:
      name: "AC input level"
      id: ac_input_level
      unit_of_measurement: "W"
      accuracy_decimals: 0
      filters:
        - lambda: |-
            static const float P310_LEVELS_W[] = {400, 800, 1200, 1600, 2200};
            int level = (int) lround((x - 300.0f) / 200.0f) + 1;
            if (x < 300.0f || level < 1 || level > 5) return NAN;
            return P310_LEVELS_W[level - 1];

  # --- fridge probe, raw. Unfiltered, for logging and for the coast test. ---
  - platform: dallas_temp
    one_wire_id: bus_1w
    # Both probes sit on one bus, so both addresses are mandatory - and once
    # they are written down, swapping a probe cannot silently swap the roles.
    # From soak 2 (measurements.md M14): this one read 5-8 C inside the fridge.
    address: ${fridge_probe}  # fridge side-wall probe
    name: "Fridge temperature (raw)"
    id: fridge_temp_raw
    update_interval: 10s
    accuracy_decimals: 2

  # --- fridge probe, control. This is what the arbiter reads. ---
  - platform: template
    name: "Fridge temperature"
    id: fridge_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // The raw probe, unsmoothed. `REVISED 2026-09-30`: the smoothing moved
      // into the arbiter ("Fridge probe filter"), where it is tunable and
      // applies to the on/off thresholds only - the 10 C hard override must
      // see the raw wall, not a 10-minute-old average of it.
      return id(fridge_temp_raw).state;
    filters:
      # Convention (section 11): every sensor feeding a control decision carries
      # a timeout. Publishing NAN is how the arbiter learns the probe is gone -
      # and 5 min later it forces AC on.
      - timeout:
          timeout: 60s
          value: !lambda return NAN;

  # What the on/off thresholds actually compare against.
  - platform: template
    name: "Fridge temperature (filtered)"
    id: fridge_temp_filtered
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: 10s
    lambda: return id(arbiter)->fridge_filtered();

  # --- cabin ambient, same 1-Wire bus. Correlates directly with duty cycle. ---
  - platform: dallas_temp
    one_wire_id: bus_1w
    address: ${cabin_probe}  # cabin ambient probe (M14)
    name: "Cabin temperature"
    id: cabin_temp
    update_interval: 30s
    accuracy_decimals: 1

  - platform: template
    name: "Parked for"
    id: parked_days
    unit_of_measurement: "d"
    accuracy_decimals: 1
    update_interval: 60s
    # Counts time in the mode, not time since the switch was thrown: it resets
    # on reboot. Good enough for the only question it is ever asked, which is
    # "how long has it been sitting there".
    lambda: return id(arbiter)->parked_for_s() / 86400.0f;

  # --- log-only diagnostics ---
  - platform: template
    # AcReason as a number for the CSV: 0 off, 1 parked, 2 boot, 3 ble lost,
    # 4 link stale, 5 probe stale, 6 watchdog, 7 fridge hard, 8 fridge,
    # 9 manual, 10 surplus.
    name: "AC reason code"
    id: ac_reason_code
    internal: true
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      static const char *const R[] = {"off", "parked", "boot", "ble lost", "link stale", "probe stale",
                                      "watchdog", "fridge (hard)", "fridge", "manual", "surplus"};
      for (int i = 0; i < 11; i++)
        if (strcmp(id(arbiter)->reason(), R[i]) == 0) return i;
      return NAN;
  - platform: template
    # Writes re-sent because the station's readback disagreed (M17). Anything
    # but a slow trickle means commands are being dropped.
    name: "AC command re-sends"
    id: ac_resends
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(arbiter)->resends();
  - platform: template
    name: "Free internal heap"
    id: heap_int
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
  - platform: template
    name: "Min free internal heap"
    id: heap_int_min
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL);
  - platform: template
    # Rows in memory not yet on the card. Grows only while the card is out or
    # failing; the ring holds ~4 days of them.
    name: "SD log behind"
    id: sd_lag
    entity_category: diagnostic
    unit_of_measurement: "rows"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(soak)->sd_lag_rows();

  - platform: template
    name: "Manual AC remaining"
    id: manual_remaining
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(arbiter)->manual_remaining_s() / 60.0f;

text_sensor:
  - platform: template
    name: "AC reason"
    id: ac_reason
    update_interval: 5s
    lambda: return {id(arbiter)->reason()};

one_wire:
  - platform: gpio
    pin: ${pin_onewire}
    id: bus_1w
    # 3-wire mode with a 4.7k pull-up at this end. Not parasitic: it saves one
    # 30 AWG strand through the door gasket, which is no gain, and is less
    # reliable.

switch:
  - platform: fbot
    fbot_id: p310
    ac:
      name: "P310 AC inverter"
      id: ac_switch
      # SINGLE WRITER (section 5.3): only ac_arbiter writes this. It stays
      # exposed in the web UI for manual override during commissioning; the
      # arbiter re-asserts its decision once a minute, so a manual change is a
      # temporary one by design.
    dc:
      name: "P310 DC output"
      id: dc_switch
      # NEVER shed this: the 12V habitation bus, and therefore every ESP node
      # and all the lighting, hangs off it (measurements.md 2026-08-18).
    usb:
      name: "P310 USB output"
      id: usb_switch
    ac_silent:
      name: "P310 silent charging"
      id: ac_silent_switch

  # The coloured state frame round the panel (D-36). The status LED (D-34) now
  # carries the same news with the screen dark, so whether the panel repeats
  # it is a matter of taste - the owner's, from the app. The state chip in the
  # panel's top corner stays either way.
  - platform: template
    name: "Panel frame"
    id: sw_panel_frame
    icon: "mdi:border-outside"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Sleep mode"
    id: sw_sleep_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(arbiter)->set_sleep_mode(true);
      - lambda: |-
          id(display_awake) = false;  // blank the screen; that is half the point
    on_turn_off:
      - lambda: id(arbiter)->set_sleep_mode(false);

  # ---------------------------------------------------------------------------
  # Parked mode. The van at home, fridge emptied and propped open, nothing to
  # protect, and weeks of standing still.
  #
  # This is the ONLY place in the firmware where the section 5.2 fail-safe
  # direction is inverted: while parked, BLE loss / dead probe / starved loop
  # all resolve to AC OFF, not ON. The justification and the whole risk
  # argument live in CLAUDE.md section 6 "Parked mode" - read it before
  # touching anything here.
  #
  # `optimistic` is deliberately absent: the switch reports the arbiter's own
  # state through `lambda`, so a refused arming request shows as the switch
  # springing back OFF rather than as a UI that disagrees with the firmware.
  # ---------------------------------------------------------------------------
  - platform: template
    name: "Parked mode"
    id: sw_parked
    icon: "mdi:home-lock"
    # DISABLED, not RESTORE_*: the switch reports the arbiter through `lambda`,
    # and a restore would run turn_off_action at boot - clearing parked_saved
    # before on_boot ever reads it, so a parked van would silently un-park on
    # every brownout. Persistence lives in the global, not here.
    restore_mode: DISABLED
    lambda: return id(arbiter)->parked();
    # Two flips, not one. The first arms and the switch springs back to off -
    # its state is read from the arbiter, so an armed-but-unconfirmed request
    # simply does not show as parked, which is the feedback. The second flip
    # inside the confirm window commits (D-14). The button's PARK screen calls
    # the same switch (D-33), so both ways in get the identical guard.
    turn_on_action:
      - lambda: id(arbiter)->park_request();
      - if:
          condition:
            lambda: return id(arbiter)->parked();
          then:
            - lambda: id(parked_saved) = true;
            # Shed what can be shed. NEVER dc_switch: the 12V habitation bus,
            # and therefore this node and every light, hangs off it - killing
            # it is unrecoverable without walking to the P310 and pressing a
            # button (measurements.md 2026-08-18).
            - switch.turn_off: usb_switch
            # Calendar ageing, not cycle ageing, is what a stored LiFePO4 pack
            # dies of. Cap the solar charge here; on exit it goes back to 100.
            - number.set:
                id: p310_charge_max
                value: !lambda return id(num_parked_charge_max).state;
            - lambda: id(display_awake) = false;
            - logger.log:
                level: WARN
                format: "PARKED: AC off, fail-safe disarmed, charge capped at %.0f%%"
                args: [id(num_parked_charge_max).state]
          else:
            # Armed, not parked. A prompt on the screen and a fast red blink on
            # the status LED (D-34) - the user is about to walk away, and must
            # not believe the van is parked when it is one press short of it.
            # Nothing has changed yet: AC still arbitrates normally and the
            # fail-safe is still armed.
            - logger.log:
                level: WARN
                format: "PARK ARMED - confirm within %us to park, or it lapses"
                args: ["(unsigned) 30"]
            - lambda: id(display_awake) = true;
    turn_off_action:
      - lambda: id(arbiter)->park_exit();
      - lambda: id(parked_saved) = false;
      - switch.turn_on: usb_switch
      - number.set:
          id: p310_charge_max
          value: 100
      - logger.log: "Parked mode cleared - normal arbitration and fail-safe resume"

  - platform: template
    name: "Drive inhibit (test)"
    id: sw_drive_inhibit
    optimistic: true
    # Phase 4 feature, shipped OFF and restored OFF. Until van-vehicle exists
    # there is no engine signal, so this switch is the manual stand-in and is
    # for bench testing only. It is bounded by the arbiter's own 4h hard
    # timeout, so leaving it on cannot strand the fridge indefinitely.
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(arbiter)->set_drive_inhibit(true);
    on_turn_off:
      - lambda: id(arbiter)->set_drive_inhibit(false);

# -----------------------------------------------------------------------------
# Buttons. These exist so the web UI can reach the same request flags the
# kitchen button reaches - and nothing more. The page is a view; the arbiter
# stays the single writer of ac_switch (CLAUDE.md section 5.3).
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Next display page"
    id: btn_next_page
    entity_category: diagnostic
    # The button's tap is the real control; this is its web-UI twin, so the
    # panel can be driven from a phone when the enclosure is shut, or before
    # the button is wired at all. Wakes as well as advances, matching the
    # tap's own "first press wakes" behaviour.
    on_press:
      - lambda: |-
          id(btn_input_ms) = millis();
          if (id(display_awake)) {
            int p = id(page_idx);
            do { p = (p + 1) % 7; } while (p == 3 && !id(arbiter)->manual_req());
            id(page_idx) = p;
          }
          id(display_awake) = true;
          id(display_wake_ms) = millis();

  - platform: template
    name: "Manual AC start"
    id: btn_manual_start
    on_press:
      - lambda: id(arbiter)->manual_press();

  - platform: template
    name: "Manual AC extend"
    id: btn_manual_extend
    # Same call as start: a short press while the timer is running extends it,
    # exactly as the physical button does. Two entities, one behaviour, because
    # "Start" and "+30 min" are different intentions to a person holding a pan.
    on_press:
      - lambda: id(arbiter)->manual_press();

  - platform: template
    name: "Manual AC cancel"
    id: btn_manual_cancel
    on_press:
      - lambda: id(arbiter)->manual_cancel();

# No `select: ac_charge_limit`. The P310's AC input level is a physical
# five-position knob (400/800/1200/1600/2200 W), so a BLE write to reg 13
# would at best be ignored and at worst leave the knob lying about the real
# limit. ESP-FBot's select also labels the positions 300..1100 W, which is
# another Fbot model. Read-only `ac_input_level` sensor above instead;
# docs/decisions.md D-16.

# -----------------------------------------------------------------------------
# The custom web UI - the page that replaces BrightEMS. Source in ui/, packed
# into flash by tools/pack_ui.py, served off the web server already running.
#
#   http://192.168.4.1/ui   this page
#   http://192.168.4.1/     stock ESPHome UI, kept as the fallback that shows
#                           every entity when this page is wrong about one
# -----------------------------------------------------------------------------
van_ui:
  path: /ui
  # `at_root: true` swaps them. Not the default until the soak settles who owns
  # "/" on an AP-only node: captive_portal wants it too.
  #
  # captive_landing: answer the phone's own connectivity probe with a landing
  # page instead of the 204 it wants. The phone concludes "no internet", keeps
  # mobile data as its default route (so the rest of the phone still works at
  # the van) and offers a one-tap notification into this UI. Set false to hand
  # those URLs back to the captive_portal component above. See
  # docs/decisions.md 2026-08-24.
  captive_landing: true

# -----------------------------------------------------------------------------
# The log. 10 s rows into a PSRAM ring, copied from there to the microSD card.
# Wiring the card: nothing - the 1.47B's slot is on-board (SDMMC 1-bit,
# GPIO14 clk / 15 cmd / 16 d0). FAT32.
# -----------------------------------------------------------------------------
sd_mmc_card:
  id: sd_card
  mode_1bit: true
  clk_pin: GPIO14
  cmd_pin: GPIO15
  data0_pin: GPIO16
  # Never format on failure. A card that will not mount is a card to look at,
  # not to erase - it may be holding the only copy of a season's log.
  format_if_mount_failed: false

sd_file_server:
  id: file_server
  url_prefix: "file"
  root_path: "/"
  enable_deletion: true
  enable_download: true
  enable_upload: false

soak_log:
  id: soak
  interval: 10s
  buffer_size: 4000000
  sd_dir: /log
  sd_interval: 60s
  remote:
    # The Athom plug in the fridge's supply (van-fridge-plug*.yaml), while it
    # is there. Polled off the main loop; if it is reflashed as the heater plug
    # these read NAN and nothing else notices.
    - url: "http://192.168.4.12/sensor/Fridge%20power"
      sensor:
        name: "Fridge power (plug)"
        id: fridge_w
        unit_of_measurement: "W"
        accuracy_decimals: 1
    - url: "http://192.168.4.12/sensor/Fridge%20energy"
      sensor:
        name: "Fridge energy (plug)"
        id: fridge_kwh
        unit_of_measurement: "kWh"
        accuracy_decimals: 4
  columns:
    - {name: t_fridge, sensor: fridge_temp_raw, accuracy_decimals: 3}
    - {name: t_fridge_f, sensor: fridge_temp_filtered, accuracy_decimals: 3}
    - {name: t_cabin, sensor: cabin_temp, accuracy_decimals: 3}
    - {name: fridge_w, sensor: fridge_w, accuracy_decimals: 1}
    - {name: fridge_kwh, sensor: fridge_kwh, accuracy_decimals: 4}
    - {name: soc, sensor: battery_percent, accuracy_decimals: 1}
    - {name: in_w, sensor: input_watts, accuracy_decimals: 0}
    - {name: out_w, sensor: output_watts, accuracy_decimals: 0}
    - {name: ac_out_w, sensor: ac_output_watts, accuracy_decimals: 0}
    - {name: ac_in_w, sensor: ac_input_watts, accuracy_decimals: 0}
    - {name: dc_in_w, sensor: dc_input_watts, accuracy_decimals: 0}
    - {name: ac_on, binary_sensor: p310_ac_active}
    - {name: ble_up, binary_sensor: p310_connected}
    - {name: ac_cmd, binary_sensor: bs_ac_on}
    - {name: reason, sensor: ac_reason_code, accuracy_decimals: 0}
    - {name: force_on, binary_sensor: bs_force_on}
    - {name: fridge_req, binary_sensor: bs_fridge_req}
    - {name: manual_req, binary_sensor: bs_manual_req}
    - {name: surplus_req, binary_sensor: bs_surplus_req}
    - {name: parked, binary_sensor: bs_parked}
    - {name: sleep, binary_sensor: bs_sleep}
    - {name: resends, sensor: ac_resends, accuracy_decimals: 0}
    - {name: heap_int, sensor: heap_int, accuracy_decimals: 0}
    - {name: heap_int_min, sensor: heap_int_min, accuracy_decimals: 0}
    - {name: die_c, sensor: board_temp, accuracy_decimals: 1}
    - {name: sd_lag, sensor: sd_lag, accuracy_decimals: 0}
    - {name: sockets, sensor: net_sockets, accuracy_decimals: 0}

# -----------------------------------------------------------------------------
# Sockets (D-29, M20). The node ran out of them after 49 h: dead peers held
# httpd sessions for good, and everything else that needed a connection was
# refused. This arms TCP keep-alive so a vanished phone's connections are
# freed in about 90 s, and counts what is open, on Diag and in the log above.
# -----------------------------------------------------------------------------
net_guard:
  update_interval: 5s
  keepalive_idle: 60s
  keepalive_interval: 10s
  keepalive_count: 3
  open_sockets:
    name: "Open sockets"
    id: net_sockets

# -----------------------------------------------------------------------------
# The arbiter. One component, one writer, one decision.
# -----------------------------------------------------------------------------
ac_arbiter:
  id: arbiter
  update_interval: 5s
  fridge_temperature: fridge_temp
  output_power: output_watts
  # Parked mode's arming interlock, and nothing else, reads this.
  cabin_temperature: cabin_temp
  input_power: input_watts
  battery_level: battery_percent
  ble_connected: p310_connected
  ac_switch: ac_switch
  # The station's own report. A dropped write is re-sent within ~10 s instead
  # of waiting for the 60 s re-assert (M17: the reconnect write was lost twice).
  ac_state: p310_ac_active
  # Must comfortably exceed the slowest feeding sensor (30s cabin / 10s fridge /
  # 5s BLE poll). Anything older than this counts as missing, and missing never
  # argues for OFF.
  sensor_max_age: 45s
  # Station silence while the BLE stack still claims a connection. Trails
  # sensor_max_age so it fires after the station-sourced sensors go invalid,
  # not while they are merely late. This is the *only* fail-safe that can still
  # reach the P310 - once ble_connected drops there is no link left to carry an
  # ON command, so BLE_LOST is recovery-on-reconnect and this is the real thing.
  # Counted from when the data went INVALID, not from the last reply: it fires
  # ~110 s after the station goes quiet (M23). ESP-FBot's give-up must come
  # later - see poll_timeout under `fbot:`.
  link_stale: 60s

# -----------------------------------------------------------------------------
# Tunables. Every threshold is a number entity so field tuning never needs a
# laptop and a reflash (section 11). restore_value keeps them across reboots.
# -----------------------------------------------------------------------------
number:
  - platform: fbot
    fbot_id: p310
    threshold_charge:
      name: "Charge max"
      id: p310_charge_max
      min_value: 10
      max_value: 100
      step: 1
    threshold_discharge:
      name: "Discharge min"
      min_value: 0
      max_value: 50
      step: 1

  - platform: template
    name: "Fridge on above"
    id: num_temp_on
    unit_of_measurement: "°C"
    min_value: 4.0
    max_value: 12.0
    step: 0.5
    initial_value: 7.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_on_c = x;

  - platform: template
    name: "Fridge off below"
    id: num_temp_off
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 8.0
    step: 0.5
    initial_value: 4.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_off_c = x;

  - platform: template
    name: "Fridge hard override"
    id: num_temp_hard
    unit_of_measurement: "°C"
    min_value: 6.0
    max_value: 15.0
    step: 0.5
    initial_value: 10.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_hard_c = x;

  - platform: template
    # Time constant of the filter between the probe and the on/off thresholds;
    # 0 = raw. The hard override always reads raw. 10 min is `UNVERIFIED`: M17
    # shows the wall probe rebounding ~9 K/h after a stop while the contents
    # move 0.5-1 K/h, and unfiltered that drove ~29 cycles a day. Read the
    # cycle count off the next log before touching it.
    name: "Fridge probe filter"
    id: num_probe_filter_min
    unit_of_measurement: "min"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().probe_filter_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Sleep ceiling"
    id: num_sleep_ceiling
    unit_of_measurement: "°C"
    # Capped at 8: above the ideal band for meat and dairy already. The
    # automation must not make that choice silently - the configured ceiling is
    # on the display.
    min_value: 4.0
    max_value: 8.0
    step: 0.5
    initial_value: 6.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().sleep_ceiling_c = x;

  - platform: template
    name: "Sleep coast target"
    id: num_sleep_target
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 5.0
    step: 0.5
    initial_value: 1.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().sleep_target_c = x;

  # Opportunistic early release only (ANALYSIS 4.2 Strategy A). This fridge's
  # inverter compressor modulates rather than stopping, so this will rarely
  # fire - and it must never be the only way a block ends. See PATCHES P2.
  - platform: template
    name: "Compressor idle threshold"
    id: num_compressor_idle_w
    unit_of_measurement: "W"
    min_value: 5
    max_value: 50
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().compressor_idle_w = x;

  - platform: template
    name: "Compressor idle debounce"
    id: num_compressor_idle_s
    unit_of_measurement: "s"
    # The tail between compressor stop and inverter shutdown is pure idle waste,
    # incurred every cycle: at 12 cycles/day a 5 min tail costs 35 Wh/day, ~7% of
    # the entire project saving. Push this down once the 24h log exists.
    min_value: 15
    max_value: 300
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().compressor_idle_ms = (uint32_t)(x * 1000);

  - platform: template
    name: "Minimum inverter on time"
    id: num_min_on_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().min_on_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Minimum inverter off time"
    id: num_min_off_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    # Sized to the block, not the old 5 min. An inverter compressor dislikes
    # frequent restarts and the equalisation penalty scales with cycle count.
    # The 10 C hard override is what makes a 20 min lockout safe - it beats
    # this timer outright.
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().min_off_ms = (uint32_t)(x * 60000);

  # --- block schedule. The two numbers the whole saving turns on, and both
  # are UNVERIFIED: they follow from the coast rate (section 8.5) and the
  # pulldown penalty, neither of which is measured. Tune these first once the
  # A/B test exists. ---
  - platform: template
    name: "Fridge run block"
    id: num_run_block_min
    unit_of_measurement: "min"
    min_value: 10
    max_value: 120
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().run_block_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Fridge rest block"
    id: num_rest_block_min
    unit_of_measurement: "min"
    min_value: 10
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().rest_block_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Manual AC duration"
    id: num_manual_min
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().manual_initial_ms = (uint32_t)(x * 60000);

  # --- the button (D-33), tunable from the app ---
  - platform: template
    name: "Button hold time"
    id: num_btn_hold
    unit_of_measurement: "s"
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: "Status LED brightness"
    id: num_led_brightness
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    # Full by default (owner, 2026-10-15): it sits behind the enclosure wall.
    initial_value: 100
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: "Button back to main after"
    id: num_btn_return
    unit_of_measurement: "s"
    min_value: 3
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Manual AC release power"
    id: num_manual_release_w
    unit_of_measurement: "W"
    # Sits well above the fridge compressor (35W) and far below an induction
    # plate or kettle, so a running fridge cannot hold the timer open.
    min_value: 50
    max_value: 500
    step: 10
    initial_value: 150
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().manual_release_w = x;

  - platform: template
    name: "Parked charge max"
    id: num_parked_charge_max
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 5
    # 80% is the compromise between calendar ageing and reserve. Solar-only
    # here, with no shore power, so this cap is the only longevity lever there
    # is - and dropping it to 60 also drops the buffer against a fortnight of
    # December. Lower it deliberately for long winter storage, not by default.
    initial_value: 80
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Surplus margin"
    id: num_surplus_w
    unit_of_measurement: "W"
    min_value: 50
    max_value: 1000
    step: 50
    initial_value: 200
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().surplus_margin_w = x;

  - platform: template
    name: "Surplus minimum SOC"
    id: num_surplus_soc
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 5
    initial_value: 85
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().surplus_soc_pct = x;

  - platform: template
    # Spare solar stops when the RAW probe falls below this, and only starts on
    # a cabinet above "Fridge off below". With AC on the fridge runs on its own
    # thermostat (medium after every power cut, M16), so without this spare
    # solar froze the cabinet: -3.7 C on 9 Oct, -0.7 C on 12 Oct (M19). Raw
    # 1 C on the wall probe left the filtered reading near 2 C. `UNVERIFIED`
    # against what the food itself reaches.
    name: "Surplus fridge floor"
    id: num_surplus_floor
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 4.0
    step: 0.5
    initial_value: 1.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().surplus_floor_c = x;

# -----------------------------------------------------------------------------
# Feedback: the status LED (D-34) and, if fitted, the button's LED
# -----------------------------------------------------------------------------
light:
  # Internal: not a control, and not worth an entity on the page. Linear (no
  # gamma) so "Status LED brightness" means what it says. Starts off; the 100 ms
  # LED interval owns it from the first tick.
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: ${pin_status_led}
    num_leds: 1
    chipset: WS2812
    # RGB, not the datasheet's GRB: with GRB, red showed green (2026-10-15).
    rgb_order: RGB
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    pin: ${pin_led_r}
    id: out_led_r
    frequency: 1000Hz
  - platform: ledc
    pin: ${pin_led_g}
    id: out_led_g
    frequency: 1000Hz
  - platform: ledc
    pin: ${pin_led_b}
    id: out_led_b
    frequency: 1000Hz
  - platform: ledc
    pin:
      number: ${pin_lcd_bl}
      ignore_strapping_warning: true
    id: out_backlight
    frequency: 20000Hz

globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: "true"
  - id: display_wake_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Which screen is showing (D-33): 0 ENERGY, 1 FRIDGE, 2 WATER, 3 COOKING
  # (only while cooking), 4 SLEEP, 5 PARK, 6 DIAG - last, since it is read on
  # purpose, not in passing (D-36). A plain index rather than ESPHome `pages:`
  # so the status strip is drawn in one place.
  - id: page_idx
    type: int
    restore_value: false
    initial_value: "0"
  # Parked mode across reboots. A switch restore_mode would do this too, but it
  # would fire on_turn_on at boot and run the arming interlock against probes
  # that have not reported yet - which refuses, and so quietly un-parks a van
  # that is meant to stay parked. Restored explicitly in on_boot instead.
  - id: parked_saved
    type: bool
    restore_value: true
    initial_value: "false"
  # A hold has just acted (D-33): the status LED flashes until this time.
  - id: led_flash_until_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # The action toast (D-31). Kind: 0 none, 1 AC on, 2 extended, 3 clipped by
  # the 3h ceiling, 4 cancelled, 5 AC on AND parked mode left; D-33 adds
  # 6 sleep on, 7 sleep off, 8 parked mode left without AC. Set by the
  # button, drawn and expired by the display lambda.
  - id: toast_kind
    type: int
    restore_value: false
    initial_value: "0"
  - id: toast_until_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: toast_added_s
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # The press whose hold bar is on the glass (D-36): its label is drawn once,
  # then only the bar moves, and the once-a-second redraw waits until it is gone.
  - id: hold_bar_press_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: toast_unparked     # this hold also took the van out of parked mode
    type: bool
    restore_value: false
    initial_value: "false"
  - id: toast_was_on       # for a cancel: was there anything to cancel
    type: bool
    restore_value: false
    initial_value: "false"
  # The button (D-33): when the press began, when the button was last touched
  # (for the fall-back to the main screen), whether this press woke the screen,
  # and whether its hold has already acted.
  - id: btn_press_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: btn_input_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: btn_woke
    type: bool
    restore_value: false
    initial_value: "false"
  - id: btn_hold_fired
    type: bool
    restore_value: false
    initial_value: "false"
  # Parked: a wake shows the big PARKED screen first; the next tap goes to the
  # ordinary pages.
  - id: park_view
    type: bool
    restore_value: false
    initial_value: "true"

script:
  # Show the action toast for 2.5s (4s for kind 5) and redraw now rather than on the next 1s
  # tick, so it lands as the finger leaves the button.
  - id: show_toast
    parameters:
      kind: int
    then:
      - lambda: |-
          id(toast_kind) = kind;
          // Leaving parked mode gets longer: it re-arms the fail-safe.
          id(toast_until_ms) = millis() + ((kind == 5 || kind == 8) ? 4000 : 2500);
          id(display_awake) = true;
          id(display_wake_ms) = millis();
      - component.update: van_display

interval:
  # The button's hold (D-33). Acts the moment it reaches "Button hold time",
  # on whatever screen is showing. Before that, the panel shows what is coming
  # and fills towards it.
  #
  # `CHANGED 2026-10-16` (D-36): the fill used to be two full redraws a second
  # (~150 ms each, M26) and visibly stepped. Now one full redraw draws the
  # label once, then every 40 ms only the bar is redrawn and only its strip is
  # pushed to the glass (vc_flush.h) - a couple of milliseconds a tick, for
  # at most the 3 s of a hold. The once-a-second full redraw waits meanwhile.
  - interval: 40ms
    then:
      - lambda: |-
          if (!id(btn_main).state || id(btn_hold_fired)) return;
          const uint32_t now = millis();
          const uint32_t held = now - id(btn_press_ms);
          const float hold_ms = id(num_btn_hold).state * 1000.0f;
          if (held < (uint32_t) hold_ms) {
            if (held < 400) return;
            // A toast owns the whole panel (D-31): no bar over it.
            if (id(toast_kind) != 0 && (int32_t) (now - id(toast_until_ms)) < 0) return;
            if (id(hold_bar_press_ms) != id(btn_press_ms)) {
              id(hold_bar_press_ms) = id(btn_press_ms);
              id(van_display).update();  // the label, once per hold
              return;
            }
            // The panel as the display: block configures it - keep in step.
            // 41 is pin_lcd_dc.
            static const vc::PanelGeom G{172, 320, 34, 0, (gpio_num_t) 41};
            vc::panel::State s;
            s.page = id(page_idx);
            s.parked = id(arbiter)->parked();
            s.parked_view = s.parked && id(park_view);
            s.park_q = id(arbiter)->park_pending();
            s.sleep = id(sw_sleep_mode).state;
            s.manual = id(arbiter)->manual_req();
            s.hold_frac = std::min(1.0f, held / hold_ms);
            const vc::panel::Rect r = vc::panel::hold_progress(*id(van_display), s);
            vc::flush_rect(id(van_display), G, r.x0, r.y0, r.x1, r.y1);
            return;
          }
          id(btn_hold_fired) = true;
          id(btn_input_ms) = now;
          id(led_flash_until_ms) = now + 300;  // the LED says it acted (D-34)
          const bool parked = id(arbiter)->parked();
          const int pg = (parked && id(park_view)) ? -1 : id(page_idx);
          if (pg == 4) {
            id(sw_sleep_mode).toggle();
            const bool on = id(sw_sleep_mode).state;
            id(show_toast).execute(on ? 6 : 7);
            // Sleep blanks the panel: show the toast, then go dark.
            if (on) id(display_wake_ms) = now - 57000;
            ESP_LOGI("button", "hold on SLEEP -> sleep %s", on ? "ON" : "OFF");
          } else if (pg == 5) {
            if (parked) {
              id(sw_parked).turn_off();
              id(page_idx) = 0;
              id(show_toast).execute(8);
              ESP_LOGI("button", "hold on PARK -> parked mode OFF");
            } else {
              // The same switch the app flips: the first request arms, a second
              // within 30 s commits (D-14). Arming shows PARK? on this screen.
              id(sw_parked).turn_on();
              if (id(arbiter)->parked()) {
                id(page_idx) = 0;
                id(park_view) = true;
                ESP_LOGW("button", "hold on PARK -> PARKED");
              } else {
                ESP_LOGW("button", "hold on PARK -> armed, hold again to confirm");
              }
              id(van_display).update();
            }
          } else if (pg == 3) {
            id(toast_was_on) = id(arbiter)->manual_req();
            id(arbiter)->manual_cancel();
            id(page_idx) = 0;
            id(show_toast).execute(4);
            ESP_LOGI("button", "hold on COOKING -> cooking stopped");
          } else {
            // Every other screen, the PARKED view included: cooking. Leaving
            // parked mode goes through the switch, not just the arbiter: its
            // off action clears parked_saved and restores USB and the 100%
            // charge cap. manual_press() alone exits in RAM only, and the next
            // brownout would re-park a van that now has food in it.
            id(toast_unparked) = parked;
            if (parked) id(sw_parked).turn_off();
            const bool was_on = id(arbiter)->manual_req();
            id(arbiter)->manual_press();
            id(toast_added_s) = id(arbiter)->manual_added_s();
            const uint32_t ext_s = id(arbiter)->config().manual_extend_ms / 1000u;
            const int k = parked ? 5 : !was_on ? 1 : id(toast_added_s) >= ext_s ? 2 : 3;
            id(show_toast).execute(k);
            ESP_LOGI("button", "hold -> cooking %s", k == 5 ? "ON, parked mode left"
                                                   : k == 1 ? "ON" : "+30 min");
          }

  # The status LED (D-34): the board's WS2812, and the button's LED if fitted.
  # The one indicator that works with the screen off. RED IS RESERVED (D-31):
  #
  #   white flash          a button hold just acted
  #   steady red           a fault: the fail-safe holding AC on (not the boot window)
  #   fast red blink       parking asked, waiting for the confirming hold
  #   red blink, 1 s in 4  parked - the fridge is off on purpose
  #   off                  sleep mode, unless one of the above
  #   cyan                 cooking AC; blinking in the timer's last minutes
  #   off                  everything else - normal running, fridge included
  #                        (owner, 2026-10-15: dark unless there is news)
  #
  # Every cue the buzzer used to give is one of these: there is no buzzer. Full
  # brightness by default - it shines through the enclosure - and tunable
  # ("Status LED brightness"); sleep mode keeps it dark unless something is wrong.
  - interval: 100ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          float r = 0, g = 0, b = 0;
          // A fault is the fail-safe holding AC on for any reason but the
          // boot window, which is routine and over in seconds.
          const bool fault = id(arbiter)->force_on() &&
                             strcmp(id(arbiter)->reason(), "boot") != 0;
          if ((int32_t) (id(led_flash_until_ms) - now) > 0) {
            r = g = b = 1.0f;
          } else if (fault) {
            r = 1.0f;
          } else if (id(arbiter)->park_pending()) {
            r = ((now / 250u) % 2u == 0u) ? 1.0f : 0.0f;
          } else if (id(arbiter)->parked()) {
            // In a dark van with a blank screen this is the only sign that the
            // fridge is deliberately dead - and the one thing that might stop
            // someone loading food into a parked van the morning of a trip.
            r = ((now / 1000u) % 4u == 0u) ? 1.0f : 0.0f;
          } else if (id(sw_sleep_mode).state) {
            // dark
          } else if (id(arbiter)->manual_req()) {
            g = b = (!id(arbiter)->manual_warning() || (now / 500u) % 2u == 0u) ? 1.0f : 0.0f;
          }
          float lvl = id(num_led_brightness).state / 100.0f;
          // The red cues always show (owner, 2026-10-16), like the panel's red
          // frame: a brightness turned right down dims them, never to nothing.
          if (r > 0.0f && g == 0.0f && b == 0.0f) lvl = std::max(lvl, 0.25f);
          id(out_led_r)->set_level(r * lvl);
          id(out_led_g)->set_level(g * lvl);
          id(out_led_b)->set_level(b * lvl);
          // The WS2812 only when it changes: a light call per tick would be
          // ten a second of nothing.
          static int shown = -1;
          const int key = ((int) (r * 9) * 100 + (int) (g * 9) * 10 + (int) (b * 9)) * 101 +
                          (int) (lvl * 100);
          if (key == shown) return;
          shown = key;
          auto call = id(status_led).make_call();
          if (r + g + b == 0.0f || lvl <= 0.0f) {
            call.set_state(false);
          } else {
            call.set_state(true);
            call.set_brightness(lvl);
            call.set_rgb(r, g, b);
          }
          call.perform();

  # BENCH REVIEW ONLY - set bench_review to 0 for the van. Cycles the pages so
  # all four can be looked at on a bare board with no button wired. In
  # the van this is exactly wrong: a page that changes while you are reading it
  # is the animation section 2 forbids, and it would fight the button.
  - interval: 6s
    then:
      - lambda: |-
          // The four reading pages: ENERGY, FRIDGE, WATER, DIAG.
          static const int READING[4] = {0, 1, 2, 6};
          static int i = 0;
          if (${bench_review}) {
            i = (i + 1) % 4;
            id(page_idx) = READING[i];
          }

  # The panel's once-a-second redraw (D-36: moved here from the display's own
  # update_interval). Skipped while a hold bar is filling: a 150 ms full frame
  # would freeze the bar mid-fill, and the bar's own path keeps it current.
  - interval: 1s
    then:
      - lambda: |-
          if (id(btn_main).state && !id(btn_hold_fired) &&
              id(hold_bar_press_ms) == id(btn_press_ms))
            return;
          id(van_display).update();

  # Display blanking. 60s of no input, or sleep mode, and the backlight goes to
  # zero: no night-light, no wasted backlight, no glow through a printed bezel.
  - interval: 1s
    then:
      - lambda: |-
          // Sleep mode blanks the screen as it starts (sw_sleep_mode on_turn_on),
          // not continuously: with one button (D-33) a deliberate press at night
          // must still be able to show something, for the usual 60 s.
          if (id(display_awake) && (millis() - id(display_wake_ms)) > 60000)
            id(display_awake) = false;
          // Back to the main screen after a quiet spell (D-33), so the next
          // hold is cooking again and an action screen never waits for a stray
          // press. COOKING goes as soon as there is nothing left to stop.
          if (id(page_idx) == 3 && !id(arbiter)->manual_req())
            id(page_idx) = 0;
          const bool off_main = id(page_idx) != 0 || (id(arbiter)->parked() && !id(park_view));
          if (!${bench_review} && off_main &&
              millis() - id(btn_input_ms) > (uint32_t) (id(num_btn_return).state * 1000.0f)) {
            id(page_idx) = 0;
            id(park_view) = true;
          }
          // bench_review pins it on: with no button wired, nothing can
          // wake the panel once it blanks, so a bare board goes dark 60s after
          // boot and stays dark. Set bench_review to 0 for the van.
          float bl = (${bench_review} || id(display_awake)) ? 0.8f : 0.0f;
          // The red cues light a dark panel the way they light the status LED
          // (owner, 2026-10-16), sleep mode included: steady for a fault - the
          // boot window is not one - and 1 s in 4 while parked, which is the
          // PARKED card flashing in an empty van. Dimmed, because nobody asked
          // for the light; ~0.1 Wh a day while parked.
          if (bl == 0.0f) {
            const bool fault = id(arbiter)->force_on() &&
                               strcmp(id(arbiter)->reason(), "boot") != 0;
            if (fault) bl = 0.3f;
            else if (id(arbiter)->parked() && (millis() / 1000u) % 4u == 0u) bl = 0.3f;
          }
          id(out_backlight)->set_level(bl);

# -----------------------------------------------------------------------------
# Display. Native 320x172 - the LCD-1.47 turned to landscape. ENERGY, FRIDGE,
# WATER, DIAG, then the action screens (D-33), cycled by the button's tap.
#
# REDESIGNED 2026-10-15 (D-36). Every screen is drawn by nodes/vc_panel.h from
# a plain struct the lambda below fills; nodes/vc_draw.h has the anti-aliased
# shapes. tools/panel_preview/ compiles the same header on a laptop and renders
# every screen and toast to PNG - review a layout change there before flashing.
#
# What survived from the first panel, unchanged:
#   - two reading distances, designed separately (see the lambda);
#   - one idea per page, one number that reads from across the van;
#   - colour never carries meaning alone - a word or a shape backs it up,
#     because this panel washes out in daylight through a printed bezel;
#   - 1s refresh, no animation: the BLE task must not be starved (section 2).
# -----------------------------------------------------------------------------
spi:
  clk_pin: ${pin_lcd_sclk}
  mosi_pin: ${pin_lcd_mosi}

font:
  # Compiled in at build time. Needs internet ON THE BUILD MACHINE only -
  # compile at home, then join the SoftAP to upload. tools/panel_preview reads
  # this list too, so the previews use exactly these faces, sizes and glyphs.
  #
  # THE TYPE SCALE IS A LEGIBILITY BUDGET, NOT A TASTE DECISION.
  #
  # `MEASURED 2026-09-11`: this panel is 32.9 x 17.7 mm - 320x172 at 247 ppi,
  # 0.1028 mm per pixel. A character is comfortable at roughly 250x its cap
  # height; the model is calibrated against the first panel, whose 15px rows
  # were reported unreadable past 30 cm, exactly as it predicts (0.27 m).
  #
  #     face                    px   cap               comfortable
  #     Barlow SemiCond 700    132    94 px   9.7 mm   2.4 m   the hero, ONE per page
  #     Barlow SemiCond 700     80    56 px   5.8 mm   1.4 m   action state, toasts
  #     Barlow 500              20    14 px   1.4 mm   0.36 m  walk-up line
  #     Barlow 600 / 500        15    11 px   1.1 mm   0.27 m  strip, chips, DIAG
  #
  # `CHANGED 2026-10-15` (D-36): Roboto 112 -> Barlow Semi Condensed 132. The
  # hero's digits grew from 80 to 94 px (2.0 -> 2.4 m) in the same width,
  # because the condensed face buys the height back. Barlow is drawn from
  # California highway signs and plates - lettering made to be read at
  # distance - and its rounded terminals match the panel's rounded corners.
  #
  # A 10 mm cap is most of the panel's height, so "readable across the van"
  # still costs one number per page, and no arrangement avoids that.
  - file: "gfonts://Barlow+Semi+Condensed@700"
    id: f_hero
    size: 132
    bpp: 4
    # A 132px 4-bit face with the full Latin range is megabytes of flash for
    # glyphs that can never be drawn. Only what a measurement can contain.
    # The degree sign is NOT in ESPHome's default glyph set: every face that
    # prints a temperature declares it, or it silently renders as nothing.
    glyphs: "-.0123456789°"
  # The unit beside the hero: deliberately small. A full-size "%" was as wide
  # as a digit and said nothing from across the van.
  - file: "gfonts://Barlow+Semi+Condensed@600"
    id: f_unit
    size: 52
    bpp: 4
    glyphs: "%°"
  # ENERGY's charge (owner, 2026-10-16): smaller than the hero, so the cabin
  # fits beside it. 66 px digits, 6.8 mm - still ~1.7 m - and the vessel next
  # to it reads from further away than either.
  - file: "gfonts://Barlow+Semi+Condensed@700"
    id: f_soc
    size: 92
    bpp: 4
    glyphs: "-0123456789"
  # The cabin temperature beside it, and the charge's "%".
  - file: "gfonts://Barlow+Semi+Condensed@600"
    id: f_mid
    size: 36
    bpp: 4
    glyphs: "-.0123456789%°"
  # Action screens (ON / OFF / PARK? / 0:42) and the button's toasts (D-31).
  - file: "gfonts://Barlow+Semi+Condensed@700"
    id: f_big
    size: 80
    bpp: 4
    glyphs: "+0123456789:?ADEFKMNOPRX"
  - file: "gfonts://Barlow@600"
    id: f_title
    size: 15
    bpp: 4
    glyphs: &text " !%()+,-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°·"
  - file: "gfonts://Barlow@500"
    id: f_body
    size: 20
    bpp: 4
    glyphs: *text
  - file: "gfonts://Barlow@500"
    id: f_small
    size: 15
    bpp: 4
    glyphs: *text
  # Icons as a font rather than images: anti-aliased, and tinted per draw like
  # text (the old 1-bit images had jagged edges at 14 px). Material Design
  # Icons, pinned to a release so a glyph cannot move under a rebuild. Code
  # points are named in vc_panel.h's `icon` namespace.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_s
    size: 20
    bpp: 4
    #       bluetooth     bt-off        night         pot-steam     car           snowflake
    #       water         parking       arrow-up      arrow-down    tap-hold      check         alert
    glyphs: &icons ["\U000F00AF", "\U000F00B2", "\U000F0594", "\U000F065A", "\U000F010B", "\U000F0717",
                    "\U000F058C", "\U000F03E3", "\U000F0737", "\U000F072E", "\U000F0D77", "\U000F012C", "\U000F0026"]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_m
    size: 22
    bpp: 4
    glyphs: *icons
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_l
    # 48 px: the action screens' tile is level with the 80 px ON / OFF beside
    # it (owner, 2026-10-16). Only the glyphs those tiles and toasts draw.
    size: 48
    bpp: 4
    #       night         pot-steam     parking
    glyphs: ["\U000F0594", "\U000F065A", "\U000F03E3"]

display:
  - platform: st7789v
    id: van_display
    model: Custom
    width: 172
    height: 320
    offset_width: 34
    offset_height: 0
    # `VERIFY on first flash`: offsets and rotation for this panel come from the
    # espp board header, not from a datasheet in hand. A 34px offset in the
    # wrong axis shows as a coloured band down one edge.
    # `CHANGED 2026-10-15`: 90 -> 270, the board as mounted reads upside down
    # at 90. Rotation is applied in software; the offset is unaffected.
    rotation: 270
    cs_pin: ${pin_lcd_cs}
    dc_pin: ${pin_lcd_dc}
    reset_pin: ${pin_lcd_rst}
    # Redrawn once a second by an interval instead (D-36), so a full frame
    # never lands in the middle of the hold bar's fast path. Taps and toasts
    # still redraw at once, as before.
    update_interval: never
    # TWO READING DISTANCES, DESIGNED SEPARATELY. `MEASURED 2026-09-11`: this
    # panel is 32.9 x 17.7 mm, so there is no type scale that is both dense and
    # legible from the far end of the van. Rather than split the difference and
    # fail at both, every page is built as:
    #
    #   FROM ACROSS THE VAN - the rim colour (what the inverter is doing), the
    #                 analogue column (battery vessel, fridge scale, action
    #                 icon) and one 140px hero number (D-36).
    #   AT 30-50 CM - the strip (page, link, the state chip) and the walk-up
    #                 line. Deliberately unreadable further away, because
    #                 making them legible would cost the hero its height.
    #
    # DIAG is the deliberate exception: it has no hero, because it is only ever
    # read at arm's length.
    #
    # One lambda rather than `pages:`; paging is `page_idx`, bumped by the
    # button. The pages themselves are functions in nodes/vc_panel.h.
    lambda: |-
      // ALL DRAWING IS IN nodes/vc_panel.h. This lambda reads the components
      // into a plain panel::State and hands it over - which is what lets the
      // same drawing code compile on a laptop (tools/panel_preview) so every
      // screen is reviewed as pixels before it is flashed. Nothing here, or
      // there, reaches the arbiter: the panel only reads (section 5.3).
      using namespace esphome::vc;
      panel::State s;

      // Toast expiry (D-31) lives here rather than in the drawing code,
      // because it writes a global.
      if (id(toast_kind) != 0 && (int32_t) (millis() - id(toast_until_ms)) >= 0)
        id(toast_kind) = 0;

      s.ble    = id(p310_connected).state;
      s.probe  = id(fridge_temp).has_state() && !std::isnan(id(fridge_temp).state);
      s.parked = id(arbiter)->parked();
      s.park_q = id(arbiter)->park_pending();
      s.force  = id(arbiter)->force_on() && !s.parked;
      s.manual = id(arbiter)->manual_req();
      s.sleep  = id(sw_sleep_mode).state;
      s.drive  = id(sw_drive_inhibit).state;
      s.ac_on  = id(arbiter)->ac_on();
      s.fridge_req  = id(arbiter)->fridge_req();
      s.surplus_req = id(arbiter)->surplus_req();
      s.reason = id(arbiter)->reason();
      // The boot window is fail-safe too, but not a fault: amber, not red
      // (D-31 keeps steady red for a real fault).
      s.boot   = strcmp(s.reason, "boot") == 0;

      s.have_soc    = id(battery_percent).has_state();
      s.soc         = s.have_soc ? id(battery_percent).state : 0.0f;
      s.have_flow   = id(input_watts).has_state() && id(output_watts).has_state();
      s.win         = s.have_flow ? id(input_watts).state : 0.0f;
      s.wout        = s.have_flow ? id(output_watts).state : 0.0f;
      s.have_rem    = id(remaining_minutes).has_state();
      s.remaining_h = s.have_rem ? id(remaining_minutes).state / 60.0f : NAN;
      s.fridge_c    = s.probe ? id(fridge_temp).state : NAN;
      s.have_cabin  = id(cabin_temp).has_state() && !std::isnan(id(cabin_temp).state);
      s.cabin_c     = s.have_cabin ? id(cabin_temp).state : NAN;
      s.t_off  = id(num_temp_off).state;
      s.t_on   = id(num_temp_on).state;
      s.t_hard = id(num_temp_hard).state;
      s.sleep_ceiling = id(num_sleep_ceiling).state;
      s.parked_d      = id(arbiter)->parked_for_s() / 86400.0f;
      s.manual_left_s = id(arbiter)->manual_remaining_s();
      s.manual_max_s  = id(arbiter)->config().manual_max_ms / 1000u;

      s.page        = id(page_idx);
      s.parked_view = s.parked && id(park_view);
      s.hold_s      = id(num_btn_hold).state;
      s.rim         = id(sw_panel_frame).state;
      s.blink       = (millis() / 1000u) % 2u == 0u;
      // Held past a tap and not yet acted on (D-33): the hold bar.
      if (id(btn_main).state && !id(btn_hold_fired)) {
        const uint32_t held = millis() - id(btn_press_ms);
        s.holding   = held >= 400;
        s.hold_frac = std::min(1.0f, held / (s.hold_s * 1000.0f));
      }
      s.toast         = id(toast_kind);
      s.toast_added_s = id(toast_added_s);
      s.toast_was_on  = id(toast_was_on);

      s.uptime_s = millis() / 1000u;
      s.heap_kb  = esp_get_free_heap_size() / 1024u;
      s.have_charge_cap = id(p310_charge_max).has_state();
      s.charge_cap      = s.have_charge_cap ? id(p310_charge_max).state : 0.0f;

      // ---- BENCH ONLY: synthetic values so the layout can be judged ---------
      // With no P310 in range and no probes on the bus every field reads "--",
      // which says nothing about the design. vc_demo.h sweeps plausible values
      // through every rim colour and both degraded paths instead.
      //
      // THIS OVERRIDES PIXELS AND NOTHING ELSE. The arbiter has already run,
      // on the real sensors, and cannot see any of it - wiring fake data into
      // the sensors instead would let a bench toggle command the real inverter
      // off, which is section 5.2's failure arriving through a debug feature.
      // Set bench_review to 0 for the van.
      if (${bench_review}) {
        const vc::demo::Frame d = vc::demo::frame(millis());
        s.ble = d.ble; s.probe = d.probe; s.parked = d.parked; s.park_q = d.park_q;
        s.force = d.force; s.manual = d.manual; s.sleep = d.sleep_; s.drive = d.drive;
        s.ac_on = d.ac_on; s.reason = d.reason; s.boot = false;
        s.have_soc = d.have_soc;   s.soc = d.soc;
        s.have_flow = d.have_flow; s.win = d.win; s.wout = d.wout;
        s.fridge_c = d.fridge_c;
        s.have_cabin = true;       s.cabin_c = d.cabin_c;
        s.have_rem = d.have_flow;  s.remaining_h = d.remaining_h;
        s.parked_d = d.parked_d;
      }

      static const panel::Fonts F{id(f_hero),  id(f_unit),   id(f_big),    id(f_title), id(f_body),
                                  id(f_small), id(f_icon_s), id(f_icon_m), id(f_icon_l),
                                  id(f_soc),   id(f_mid)};
      panel::draw(it, s, F);
