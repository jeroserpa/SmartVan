# van-core - the node the whole project exists for.
#
# Holds the BLE link to the P310, the fridge probe, the AC arbiter, the manual
# cooking button and the SoftAP everything else joins. Fridge control is
# entirely local to this node and never reads the network (CLAUDE.md section 5.1).
#
# Board: Waveshare ESP32-S3-LCD-1.47B (ESP32-S3R8, 8MB PSRAM, 16MB flash).
# THE B VARIANT - `VERIFIED 2026-08-30` against the vendor schematic
# (files.waveshare.com/wiki/ESP32-S3-LCD-1.47B/). Almost the non-B pinout, with
# three differences that cost half a day of black screen:
#   - LCD_BL is GPIO46 (active high, SI2302 low-side on LEDK), NOT GPIO48
#   - IO47/IO48 are the onboard QMI8658 IMU's I2C bus - do not repurpose
#   - there is a battery charger (ETA6098) and BAT_ADC on IO1
#
# BEFORE THIS GOES IN THE VAN: run nodes/van-core-soak.yaml for 24h.
# BEFORE EVERY TRIP: pull the BLE antenna, unplug the probe, confirm AC ends ON.

substitutions:
  node_name: van-core
  friendly_name: Van core
  # POWER-0183, found by tools/fbot_probe.py scan on 2026-08-18.
  p310_mac: "E8:06:90:C7:AD:F6"

  # --- pins: display (onboard, plain SPI ST7789) ---
  pin_lcd_sclk: GPIO40
  pin_lcd_mosi: GPIO45
  pin_lcd_cs: GPIO42
  pin_lcd_dc: GPIO41
  pin_lcd_rst: GPIO39
  # GPIO46 is a strapping pin; fine as an output after boot, override below.
  pin_lcd_bl: GPIO46

  # --- pins: external wiring, all on 3.5mm pluggable screw terminals ---
  # Connectors are keyed by pin count so they cannot be mis-plugged at 11pm in
  # a car park: 2-pin = 12V in, 3-pin = 1-Wire, 4-pin = button+LED.
  pin_onewire: GPIO4
  pin_btn_manual: GPIO5   # kitchen, illuminated momentary
  pin_btn_page: GPIO6     # bezel: wake / cycle pages
  pin_btn_sleep: GPIO7    # bezel: long press toggles sleep mode
  pin_led_r: GPIO9
  pin_led_g: GPIO10
  pin_led_b: GPIO11
  pin_buzzer: GPIO8
  # GPIO0 (BOOT) is NOT used as a runtime button: it is a strapping pin, and
  # holding it across a reset silently drops the board into download mode.

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "AC arbiter, P310 BLE link, fridge control"
  # Pin the toolchain. A routine ESPHome update must not invalidate a working
  # config two days before a trip (CLAUDE.md section 11).
  min_version: 2025.7.0
  # Palette and the three drawing primitives ESPHome lacks (arc gauge, IEC AC
  # mark, flag pill). Shared with the bench rig so the two cannot drift.
  includes:
    - vc_draw.h
  on_boot:
    # Priority 800 is before almost everything else. The arbiter's own setup()
    # already commands AC ON; this is the belt to that braces.
    - priority: 800
      then:
        - logger.log: "van-core boot: AC held ON until the arbiter says otherwise"
    # Priority -100: last of all, after ac_arbiter's own setup() has already
    # commanded AC ON. Restoring parked mode is the one thing allowed to undo
    # that, and it must be explicit rather than a side effect of switch restore
    # semantics - a van meant to stay parked for three weeks must not un-park
    # itself because a brownout rebooted the node.
    - priority: -100
      then:
        - if:
            condition:
              lambda: return id(parked_saved);
            then:
              - lambda: id(arbiter)->set_parked(true);
              - logger.log:
                  level: WARN
                  format: "van-core boot: PARKED restored - AC held OFF, fail-safe disarmed"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    # esp-idf, matching the ESP-FBot examples. `UNVERIFIED`: the sd_mmc_card
    # component's docs show arduino. Both must build under one framework on this
    # node - that is what the soak config exists to settle.
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

packages:
  base: !include ../common/base.yaml

external_components:
  # The whole reason this project is ESPHome rather than custom firmware: the
  # P310 BLE protocol, already solved. Apache-2.0.
  - source: github://ylianst/esp-fbot
    refresh: 1d
  # The arbiter. Pure state machine, host-tested in test/.
  - source:
      type: local
      path: ../components

# -----------------------------------------------------------------------------
# Network. SoftAP only - no router exists in the van, and no station mode is
# configured on purpose so this node cannot sit there scanning for a network
# that is not there.
# -----------------------------------------------------------------------------
wifi:
  ap:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
  # `TODO/VERIFY`: CLAUDE.md section 4 wants max_connection raised to 8. ESPHome
  # exposes no YAML key for the SoftAP max_connection; it is set in the wifi
  # component. With phone + water + heater + vehicle the default is already met.
  # Settle this before adding the fourth client, not after.

# captive_portal is DELIBERATELY ABSENT. Two independent reasons, both measured:
#
# 1. `MEASURED 2026-08-30`: with it enabled, a phone could see this AP and
#    never complete the WPA2 4-way handshake - "saved, connection failure".
#    esphome/components/wifi/wifi_component.cpp:722-731: on an AP-ONLY node
#    with captive_portal present, ESPHome puts the radio into AP+STA and calls
#    start_scanning(), and that STA_SCANNING state overwrites the AP state set
#    a few lines earlier. The node then scans channels forever while trying to
#    hold an AP on one. Removing it, with nothing else changed, made the phone
#    join first time and the web UI load.
# 2. `MEASURED 2026-08-24` (van-core-ttgo.yaml): it registers a catch-all
#    handler and wins "/", serving a wifi-provisioning scan list instead of
#    the UI - on a node that has no station mode and no credentials to
#    provision, i.e. offering an action that must never be taken.
#
# van_ui's `captive_landing: true` already answers the phone's connectivity
# probe with the landing page, which is all captive_portal was wanted for.

# -----------------------------------------------------------------------------
# P310 over BLE
# -----------------------------------------------------------------------------
# `scan_parameters.window` is set EXPLICITLY and must stay that way.
#
# ESPHome 2026.8.0 raises a *defaulted* scan window to equal the interval
# whenever software coexistence is compiled in and IDF >= 5.5.5 - see
# esp32_ble_tracker/__init__.py, _raise_defaulted_scan_window(). The default
# build therefore compiles to 320ms/320ms: a 100% duty-cycle BLE scan, on the
# theory that "BLE uses the airtime wifi does not claim".
#
# That theory does not survive contact with SoftAP. `MEASURED 2026-08-23`
# (measurements.md M9, on the TTGO rig): with the full-duty scan running, a
# phone could see the AP but every join ended in "saved, connection failure" -
# the WPA2 4-way handshake never completed. `REPRODUCED 2026-08-30` on this
# board, where it was worse: the AP did not even appear in a laptop scan while
# the P310 was out of range and the tracker was hunting for it continuously.
#
# The failure is worst exactly when it hurts most: BLE down is the fault the
# web UI exists to diagnose, and that is the state in which the tracker scans
# hardest and the UI disappears.
#
# 30ms/320ms is ~9% duty. A user-set window is never touched by the code above,
# so setting it here opts out of the aggressive default. Do not delete this key
# to "clean up the config" - it is load-bearing.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms

ble_client:
  - mac_address: ${p310_mac}
    id: p310_ble

fbot:
  id: p310
  polling_interval: 5s           # matches the arbiter tick; no point going faster
  settings_polling_interval: 60s # thresholds change rarely
  poll_timeout: 15s
  max_poll_failures: 3

binary_sensor:
  - platform: fbot
    fbot_id: p310
    connected:
      name: "P310 connected"
      id: p310_connected
    ac_active:
      name: "P310 AC output active"
      id: p310_ac_active
    dc_active:
      name: "P310 DC output active"
      id: p310_dc_active

  # --- manual AC request (the cooking button) ---
  - platform: gpio
    name: "Manual AC button"
    id: btn_manual
    pin:
      number: ${pin_btn_manual}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # 50ms in software rejects both contact bounce and induced transients from
      # a long run past a 3300W inverter: a spike would have to persist 50ms to
      # register. A phantom press arms the inverter for 45 min and goes unnoticed
      # for days, so this is not decoration.
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_click:
      - min_length: 50ms
        max_length: 900ms
        then:
          - lambda: id(arbiter)->manual_press();
      - min_length: 1s
        max_length: 10s
        then:
          - lambda: id(arbiter)->manual_cancel();

  # --- bezel buttons ---
  - platform: gpio
    name: "Page button"
    id: btn_page
    internal: true
    pin:
      number: ${pin_btn_page}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - lambda: |-
            // First press wakes; subsequent presses cycle. The screen is dark
            // most of the time, so page-cycling a blank display is never useful.
            if (id(display_awake)) {
              id(page_idx) = (id(page_idx) + 1) % 4;
            }
            id(display_awake) = true;
            id(display_wake_ms) = millis();

  - platform: gpio
    name: "Sleep button"
    id: btn_sleep
    internal: true
    pin:
      number: ${pin_btn_sleep}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_click:
      # 1-4s: sleep mode. 5s+: parked mode. Two very different commitments, so
      # they get two clearly different gestures on the same button rather than
      # a menu - and the long one is the one you cannot trigger by accident
      # while reaching past it in the dark.
      - min_length: 1s
        max_length: 4s
        then:
          - switch.toggle: sw_sleep_mode
      # Twice: the first long press arms, the second within 30s commits. The
      # switch reads its state from the arbiter, so an armed request still
      # reads "off" and the toggle lands on turn_on again - no separate
      # confirm gesture to remember.
      - min_length: 5s
        max_length: 20s
        then:
          - switch.toggle: sw_parked

  # --- arbiter state, exposed for the web UI and for logging ---
  - platform: template
    name: "AC on"
    id: bs_ac_on
    lambda: return id(arbiter)->ac_on();
  - platform: template
    name: "Force on (fail-safe)"
    lambda: return id(arbiter)->force_on();
  - platform: template
    name: "Fridge request"
    lambda: return id(arbiter)->fridge_req();
  - platform: template
    name: "Manual request"
    lambda: return id(arbiter)->manual_req();
  - platform: template
    name: "Surplus request"
    lambda: return id(arbiter)->surplus_req();
  - platform: template
    name: "Parked"
    id: bs_parked
    lambda: return id(arbiter)->parked();

sensor:
  - platform: fbot
    fbot_id: p310
    battery_level:
      name: "Battery"
      id: battery_percent
    input_power:
      name: "Input power"
      id: input_watts
    output_power:
      name: "Output power"
      id: output_watts
    system_power:
      name: "System power"
      id: system_watts
    ac_input_power:
      name: "AC input power"
      id: ac_input_watts
    dc_input_power:
      name: "Solar input power"
      id: dc_input_watts
    remaining_time:
      name: "Remaining minutes"
      id: remaining_minutes
    ac_out_voltage:
      name: "AC output voltage"

  # --- fridge probe, raw. Unfiltered, for logging and for the coast test. ---
  - platform: dallas_temp
    one_wire_id: bus_1w
    # TODO: fill in from the 1-Wire bus scan the component logs on first boot.
    # Both probes sit on one bus, so both addresses are mandatory - and once
    # they are written down, swapping a probe cannot silently swap the roles.
    address: 0x0000000000000028  # PLACEHOLDER - fridge wall probe
    name: "Fridge temperature (raw)"
    id: fridge_temp_raw
    update_interval: 10s
    accuracy_decimals: 2

  # --- fridge probe, control. This is what the arbiter reads. ---
  - platform: template
    name: "Fridge temperature"
    id: fridge_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // Pass the raw probe through; the smoothing is in the filters below so
      // that a NAN from the timeout filter propagates as a NAN.
      return id(fridge_temp_raw).state;
    filters:
      # ~3 min time constant at a 10s update. This replaces the water bottle the
      # earlier revision put the probe in: door-opening excursions are damped in
      # software, and real fridge dynamics are far slower than this.
      - exponential_moving_average:
          alpha: 0.05
          send_every: 1
      # Convention (section 11): every sensor feeding a control decision carries
      # a timeout. Publishing NAN is how the arbiter learns the probe is gone -
      # and 5 min later it forces AC on.
      - timeout:
          timeout: 60s
          value: !lambda return NAN;

  # --- cabin ambient, same 1-Wire bus. Correlates directly with duty cycle. ---
  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0x0000000000000029  # PLACEHOLDER - cabin ambient probe
    name: "Cabin temperature"
    id: cabin_temp
    update_interval: 30s
    accuracy_decimals: 1

  - platform: template
    name: "Parked for"
    id: parked_days
    unit_of_measurement: "d"
    accuracy_decimals: 1
    update_interval: 60s
    # Counts time in the mode, not time since the switch was thrown: it resets
    # on reboot. Good enough for the only question it is ever asked, which is
    # "how long has it been sitting there".
    lambda: return id(arbiter)->parked_for_s() / 86400.0f;

  - platform: template
    name: "Manual AC remaining"
    id: manual_remaining
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(arbiter)->manual_remaining_s() / 60.0f;

text_sensor:
  - platform: template
    name: "AC reason"
    id: ac_reason
    update_interval: 5s
    lambda: return {id(arbiter)->reason()};

one_wire:
  - platform: gpio
    pin: ${pin_onewire}
    id: bus_1w
    # 3-wire mode with a 4.7k pull-up at this end. Not parasitic: it saves one
    # 30 AWG strand through the door gasket, which is no gain, and is less
    # reliable.

switch:
  - platform: fbot
    fbot_id: p310
    ac:
      name: "P310 AC inverter"
      id: ac_switch
      # SINGLE WRITER (section 5.3): only ac_arbiter writes this. It stays
      # exposed in the web UI for manual override during commissioning; the
      # arbiter re-asserts its decision once a minute, so a manual change is a
      # temporary one by design.
    dc:
      name: "P310 DC output"
      id: dc_switch
      # NEVER shed this: the 12V habitation bus, and therefore every ESP node
      # and all the lighting, hangs off it (measurements.md 2026-08-18).
    usb:
      name: "P310 USB output"
      id: usb_switch
    ac_silent:
      name: "P310 silent charging"
      id: ac_silent_switch

  - platform: template
    name: "Sleep mode"
    id: sw_sleep_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(arbiter)->set_sleep_mode(true);
      - lambda: |-
          id(display_awake) = false;  // blank the screen; that is half the point
    on_turn_off:
      - lambda: id(arbiter)->set_sleep_mode(false);

  # ---------------------------------------------------------------------------
  # Parked mode. The van at home, fridge emptied and propped open, nothing to
  # protect, and weeks of standing still.
  #
  # This is the ONLY place in the firmware where the section 5.2 fail-safe
  # direction is inverted: while parked, BLE loss / dead probe / starved loop
  # all resolve to AC OFF, not ON. The justification and the whole risk
  # argument live in CLAUDE.md section 6 "Parked mode" - read it before
  # touching anything here.
  #
  # `optimistic` is deliberately absent: the switch reports the arbiter's own
  # state through `lambda`, so a refused arming request shows as the switch
  # springing back OFF rather than as a UI that disagrees with the firmware.
  # ---------------------------------------------------------------------------
  - platform: template
    name: "Parked mode"
    id: sw_parked
    icon: "mdi:home-lock"
    # DISABLED, not RESTORE_*: the switch reports the arbiter through `lambda`,
    # and a restore would run turn_off_action at boot - clearing parked_saved
    # before on_boot ever reads it, so a parked van would silently un-park on
    # every brownout. Persistence lives in the global, not here.
    restore_mode: DISABLED
    lambda: return id(arbiter)->parked();
    # Two flips, not one. The first arms and the switch springs back to off -
    # its state is read from the arbiter, so an armed-but-unconfirmed request
    # simply does not show as parked, which is the feedback. The second flip
    # inside the confirm window commits. Same call from the bezel gesture, so
    # both entry paths get the identical guard (D-14).
    turn_on_action:
      - lambda: id(arbiter)->park_request();
      - if:
          condition:
            lambda: return id(arbiter)->parked();
          then:
            - lambda: id(parked_saved) = true;
            # Shed what can be shed. NEVER dc_switch: the 12V habitation bus,
            # and therefore this node and every light, hangs off it - killing
            # it is unrecoverable without walking to the P310 and pressing a
            # button (measurements.md 2026-08-18).
            - switch.turn_off: usb_switch
            # Calendar ageing, not cycle ageing, is what a stored LiFePO4 pack
            # dies of. Cap the solar charge here; on exit it goes back to 100.
            - number.set:
                id: p310_charge_max
                value: !lambda return id(num_parked_charge_max).state;
            - lambda: id(display_awake) = false;
            - logger.log:
                level: WARN
                format: "PARKED: AC off, fail-safe disarmed, charge capped at %.0f%%"
                args: [id(num_parked_charge_max).state]
          else:
            # Armed, not parked. One chirp and a prompt - the user is about to
            # walk away, and must not believe the van is parked when it is one
            # press short of it. Nothing has changed yet: AC still arbitrates
            # normally and the fail-safe is still armed.
            - logger.log:
                level: WARN
                format: "PARK ARMED - confirm within %us to park, or it lapses"
                args: ["(unsigned) 30"]
            - lambda: id(display_awake) = true;
            - lambda: id(out_buzzer)->set_level(0.5f);
            - delay: 120ms
            - lambda: id(out_buzzer)->set_level(0.0f);
    turn_off_action:
      - lambda: id(arbiter)->park_exit();
      - lambda: id(parked_saved) = false;
      - switch.turn_on: usb_switch
      - number.set:
          id: p310_charge_max
          value: 100
      - logger.log: "Parked mode cleared - normal arbitration and fail-safe resume"

  - platform: template
    name: "Drive inhibit (test)"
    id: sw_drive_inhibit
    optimistic: true
    # Phase 4 feature, shipped OFF and restored OFF. Until van-vehicle exists
    # there is no engine signal, so this switch is the manual stand-in and is
    # for bench testing only. It is bounded by the arbiter's own 4h hard
    # timeout, so leaving it on cannot strand the fridge indefinitely.
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(arbiter)->set_drive_inhibit(true);
    on_turn_off:
      - lambda: id(arbiter)->set_drive_inhibit(false);

# -----------------------------------------------------------------------------
# Buttons. These exist so the web UI can reach the same request flags the
# kitchen button reaches - and nothing more. The page is a view; the arbiter
# stays the single writer of ac_switch (CLAUDE.md section 5.3).
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Manual AC start"
    id: btn_manual_start
    on_press:
      - lambda: id(arbiter)->manual_press();

  - platform: template
    name: "Manual AC extend"
    id: btn_manual_extend
    # Same call as start: a short press while the timer is running extends it,
    # exactly as the physical button does. Two entities, one behaviour, because
    # "Start" and "+30 min" are different intentions to a person holding a pan.
    on_press:
      - lambda: id(arbiter)->manual_press();

  - platform: template
    name: "Manual AC cancel"
    id: btn_manual_cancel
    on_press:
      - lambda: id(arbiter)->manual_cancel();

select:
  - platform: fbot
    fbot_id: p310
    ac_charge_limit:
      name: "AC charge limit"
      id: ac_charge_limit

# -----------------------------------------------------------------------------
# The custom web UI - the page that replaces BrightEMS. Source in ui/, packed
# into flash by tools/pack_ui.py, served off the web server already running.
#
#   http://192.168.4.1/ui   this page
#   http://192.168.4.1/     stock ESPHome UI, kept as the fallback that shows
#                           every entity when this page is wrong about one
# -----------------------------------------------------------------------------
van_ui:
  path: /ui
  # `at_root: true` swaps them. Not the default until the soak settles who owns
  # "/" on an AP-only node: captive_portal wants it too.
  #
  # captive_landing: answer the phone's own connectivity probe with a landing
  # page instead of the 204 it wants. The phone concludes "no internet", keeps
  # mobile data as its default route (so the rest of the phone still works at
  # the van) and offers a one-tap notification into this UI. Set false to hand
  # those URLs back to the captive_portal component above. See
  # docs/decisions.md 2026-08-24.
  captive_landing: true

# -----------------------------------------------------------------------------
# The arbiter. One component, one writer, one decision.
# -----------------------------------------------------------------------------
ac_arbiter:
  id: arbiter
  update_interval: 5s
  fridge_temperature: fridge_temp
  output_power: output_watts
  # Parked mode's arming interlock, and nothing else, reads this.
  cabin_temperature: cabin_temp
  input_power: input_watts
  battery_level: battery_percent
  ble_connected: p310_connected
  ac_switch: ac_switch
  # Must comfortably exceed the slowest feeding sensor (30s cabin / 10s fridge /
  # 5s BLE poll). Anything older than this counts as missing, and missing never
  # argues for OFF.
  sensor_max_age: 45s
  # Station silence while the BLE stack still claims a connection. Trails
  # sensor_max_age so it fires after the station-sourced sensors go invalid,
  # not while they are merely late. This is the *only* fail-safe that can still
  # reach the P310 - once ble_connected drops there is no link left to carry an
  # ON command, so BLE_LOST is recovery-on-reconnect and this is the real thing.
  link_stale: 60s

# -----------------------------------------------------------------------------
# Tunables. Every threshold is a number entity so field tuning never needs a
# laptop and a reflash (section 11). restore_value keeps them across reboots.
# -----------------------------------------------------------------------------
number:
  - platform: fbot
    fbot_id: p310
    threshold_charge:
      name: "Charge max"
      id: p310_charge_max
      min_value: 10
      max_value: 100
      step: 1
    threshold_discharge:
      name: "Discharge min"
      min_value: 0
      max_value: 50
      step: 1

  - platform: template
    name: "Fridge on above"
    id: num_temp_on
    unit_of_measurement: "°C"
    min_value: 4.0
    max_value: 12.0
    step: 0.5
    initial_value: 7.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_on_c = x;

  - platform: template
    name: "Fridge off below"
    id: num_temp_off
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 8.0
    step: 0.5
    initial_value: 4.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_off_c = x;

  - platform: template
    name: "Fridge hard override"
    id: num_temp_hard
    unit_of_measurement: "°C"
    min_value: 6.0
    max_value: 15.0
    step: 0.5
    initial_value: 10.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().temp_hard_c = x;

  - platform: template
    name: "Sleep ceiling"
    id: num_sleep_ceiling
    unit_of_measurement: "°C"
    # Capped at 8: above the ideal band for meat and dairy already. The
    # automation must not make that choice silently - the configured ceiling is
    # on the display.
    min_value: 4.0
    max_value: 8.0
    step: 0.5
    initial_value: 6.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().sleep_ceiling_c = x;

  - platform: template
    name: "Sleep coast target"
    id: num_sleep_target
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 5.0
    step: 0.5
    initial_value: 1.0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().sleep_target_c = x;

  # Opportunistic early release only (ANALYSIS 4.2 Strategy A). This fridge's
  # inverter compressor modulates rather than stopping, so this will rarely
  # fire - and it must never be the only way a block ends. See PATCHES P2.
  - platform: template
    name: "Compressor idle threshold"
    id: num_compressor_idle_w
    unit_of_measurement: "W"
    min_value: 5
    max_value: 50
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().compressor_idle_w = x;

  - platform: template
    name: "Compressor idle debounce"
    id: num_compressor_idle_s
    unit_of_measurement: "s"
    # The tail between compressor stop and inverter shutdown is pure idle waste,
    # incurred every cycle: at 12 cycles/day a 5 min tail costs 35 Wh/day, ~7% of
    # the entire project saving. Push this down once the 24h log exists.
    min_value: 15
    max_value: 300
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().compressor_idle_ms = (uint32_t)(x * 1000);

  - platform: template
    name: "Minimum inverter on time"
    id: num_min_on_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().min_on_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Minimum inverter off time"
    id: num_min_off_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    # Sized to the block, not the old 5 min. An inverter compressor dislikes
    # frequent restarts and the equalisation penalty scales with cycle count.
    # The 10 C hard override is what makes a 20 min lockout safe - it beats
    # this timer outright.
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().min_off_ms = (uint32_t)(x * 60000);

  # --- block schedule. The two numbers the whole saving turns on, and both
  # are UNVERIFIED: they follow from the coast rate (section 8.5) and the
  # pulldown penalty, neither of which is measured. Tune these first once the
  # A/B test exists. ---
  - platform: template
    name: "Fridge run block"
    id: num_run_block_min
    unit_of_measurement: "min"
    min_value: 10
    max_value: 120
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().run_block_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Fridge rest block"
    id: num_rest_block_min
    unit_of_measurement: "min"
    min_value: 10
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().rest_block_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Manual AC duration"
    id: num_manual_min
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().manual_initial_ms = (uint32_t)(x * 60000);

  - platform: template
    name: "Manual AC release power"
    id: num_manual_release_w
    unit_of_measurement: "W"
    # Sits well above the fridge compressor (35W) and far below an induction
    # plate or kettle, so a running fridge cannot hold the timer open.
    min_value: 50
    max_value: 500
    step: 10
    initial_value: 150
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().manual_release_w = x;

  - platform: template
    name: "Parked charge max"
    id: num_parked_charge_max
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 5
    # 80% is the compromise between calendar ageing and reserve. Solar-only
    # here, with no shore power, so this cap is the only longevity lever there
    # is - and dropping it to 60 also drops the buffer against a fortnight of
    # December. Lower it deliberately for long winter storage, not by default.
    initial_value: 80
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Surplus margin"
    id: num_surplus_w
    unit_of_measurement: "W"
    min_value: 50
    max_value: 1000
    step: 50
    initial_value: 200
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().surplus_margin_w = x;

  - platform: template
    name: "Surplus minimum SOC"
    id: num_surplus_soc
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 5
    initial_value: 85
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(arbiter)->config().surplus_soc_pct = x;

# -----------------------------------------------------------------------------
# Feedback: button LED and buzzer
# -----------------------------------------------------------------------------
output:
  - platform: ledc
    pin: ${pin_led_r}
    id: out_led_r
    frequency: 1000Hz
  - platform: ledc
    pin: ${pin_led_g}
    id: out_led_g
    frequency: 1000Hz
  - platform: ledc
    pin: ${pin_led_b}
    id: out_led_b
    frequency: 1000Hz
  - platform: ledc
    pin: ${pin_buzzer}
    id: out_buzzer
    frequency: 2700Hz
  - platform: ledc
    pin:
      number: ${pin_lcd_bl}
      ignore_strapping_warning: true
    id: out_backlight
    frequency: 20000Hz

globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: "true"
  - id: display_wake_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Which of the four display pages is showing. A plain index rather than
  # ESPHome `pages:` so the status strip is drawn in one place.
  - id: page_idx
    type: int
    restore_value: false
    initial_value: "0"
  # Parked mode across reboots. A switch restore_mode would do this too, but it
  # would fire on_turn_on at boot and run the arming interlock against probes
  # that have not reported yet - which refuses, and so quietly un-parks a van
  # that is meant to stay parked. Restored explicitly in on_boot instead.
  - id: parked_saved
    type: bool
    restore_value: true
    initial_value: "false"
  - id: buzzer_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  # Button LED. Green = manual active, amber = fridge-driven, off = inverter
  # down. Dim: this is a metre from where someone sleeps.
  - interval: 1s
    then:
      - lambda: |-
          float r = 0, g = 0, b = 0;
          if (id(arbiter)->parked()) {
            // A dim blue blink, ~1s in 4. In a dark van with a blank screen
            // this is the only sign that the fridge is deliberately dead - and
            // the one thing that might stop someone loading food into a parked
            // van the morning of a trip.
            b = ((millis() / 1000u) % 4u == 0u) ? 0.15f : 0.0f;
          } else if (id(arbiter)->manual_req()) {
            g = 0.25f;                       // green: you asked for this
          } else if (id(arbiter)->ac_on()) {
            r = 0.20f; g = 0.06f;            // amber: the fridge asked for it
          }
          id(out_led_r)->set_level(r);
          id(out_led_g)->set_level(g);
          id(out_led_b)->set_level(b);

  # Buzzer: a short chirp while the manual timer is inside its warning window,
  # at most once every 30s. Suppressed in sleep mode - waking someone to tell
  # them the inverter is about to turn itself off is absurd.
  - interval: 5s
    then:
      - lambda: |-
          if (!id(arbiter)->manual_warning()) return;
          if (id(sw_sleep_mode).state) return;
          if (id(arbiter)->parked()) return;
          const uint32_t now = millis();
          if (now - id(buzzer_last_ms) < 30000) return;
          id(buzzer_last_ms) = now;
          id(out_buzzer)->set_level(0.5f);
      - delay: 120ms
      - lambda: id(out_buzzer)->set_level(0.0f);

  # Display blanking. 60s of no input, or sleep mode, and the backlight goes to
  # zero: no night-light, no wasted backlight, no glow through a printed bezel.
  - interval: 1s
    then:
      - lambda: |-
          if (id(sw_sleep_mode).state)
            id(display_awake) = false;
          if (id(display_awake) && (millis() - id(display_wake_ms)) > 60000)
            id(display_awake) = false;
          id(out_backlight)->set_level(id(display_awake) ? 0.8f : 0.0f);

# -----------------------------------------------------------------------------
# Display. Native 320x172 - the LCD-1.47 turned to landscape - four pages
# cycled by the bezel button. Same instrument-dark language as the bench rig
# (nodes/vc_draw.h holds the palette and the three primitives ESPHome lacks),
# re-laid for the panel the design was drawn for instead of scaled down to it.
#
# What survived the small screen:
#   - one idea per page, and at most two numbers a metre away can read;
#   - every STATE lives in the 20px top strip, so pages never repeat it;
#   - colour never carries meaning alone - shape or words back it up, because
#     this panel washes out in daylight through a printed bezel;
#   - 1s refresh, no animation: the BLE task must not be starved (section 2).
#
# Fonts are 4-bit anti-aliased. On a 1.47" panel that is the single biggest
# legibility win available and it costs flash only - 16MB here.
# -----------------------------------------------------------------------------
spi:
  clk_pin: ${pin_lcd_sclk}
  mosi_pin: ${pin_lcd_mosi}

font:
  # Compiled in from Google Fonts at build time. Needs internet ON THE BUILD
  # MACHINE only - compile at home, then join the SoftAP to upload.
  # The two big faces carry only what a number can contain: a 56px 4-bit font
  # with the whole Latin range is a lot of flash for glyphs never drawn.
  - file: "gfonts://Roboto@700"
    id: f_mega
    size: 56
    bpp: 4
    glyphs: "0123456789.-+°CLW% "
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 42
    bpp: 4
    glyphs: "0123456789.-+°CLW% "
  - file: "gfonts://Roboto@500"
    id: f_med
    size: 20
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_row
    size: 15
    bpp: 4
  - file: "gfonts://Roboto@500"
    id: f_lbl
    size: 12
    bpp: 4

# Real MDI glyphs. 14px for the status strip, 20px where an icon labels a row.
image:
  - { id: ico_bt,    file: "mdi:bluetooth",     resize: 14x14, type: BINARY }
  - { id: ico_btoff, file: "mdi:bluetooth-off", resize: 14x14, type: BINARY }
  - { id: ico_moon,  file: "mdi:weather-night", resize: 14x14, type: BINARY }
  - { id: ico_pot,   file: "mdi:pot-steam",     resize: 14x14, type: BINARY }
  - { id: ico_car,   file: "mdi:car",           resize: 14x14, type: BINARY }
  - { id: ico_snow,  file: "mdi:snowflake",     resize: 14x14, type: BINARY }
  - { id: ico_drop,  file: "mdi:water",         resize: 14x14, type: BINARY }
  - { id: ico_sun,   file: "mdi:weather-sunny", resize: 20x20, type: BINARY }
  - { id: ico_alt,   file: "mdi:car",           resize: 20x20, type: BINARY }
  - { id: ico_plug,  file: "mdi:power-plug",    resize: 20x20, type: BINARY }

display:
  - platform: st7789v
    id: van_display
    model: Custom
    width: 172
    height: 320
    offset_width: 34
    offset_height: 0
    # `VERIFY on first flash`: offsets and rotation for this panel come from the
    # espp board header, not from a datasheet in hand. A 34px offset in the
    # wrong axis shows as a coloured band down one edge.
    rotation: 90
    cs_pin: ${pin_lcd_cs}
    dc_pin: ${pin_lcd_dc}
    reset_pin: ${pin_lcd_rst}
    update_interval: 1s
    # One lambda rather than `pages:` so the status strip is drawn once, not
    # pasted into four page bodies. Paging is `page_idx`, bumped by the bezel.
    lambda: |-
      using namespace esphome::vc;
      using display::TextAlign;
      it.fill(bg());

      // ---- shared state ----------------------------------------------------
      const bool ble    = id(p310_connected).state;
      const bool probe  = id(fridge_temp).has_state() && !std::isnan(id(fridge_temp).state);
      const bool parked = id(arbiter)->parked();
      const bool force  = id(arbiter)->force_on() && !parked;
      const bool manual = id(arbiter)->manual_req();
      const bool sleep_ = id(sw_sleep_mode).state;
      const bool drive  = id(sw_drive_inhibit).state;
      const bool ac_on  = id(arbiter)->ac_on();

      const bool  have_soc  = id(battery_percent).has_state();
      const float soc       = have_soc ? id(battery_percent).state : 0.0f;
      const bool  have_flow = id(input_watts).has_state() && id(output_watts).has_state();
      const float win       = have_flow ? id(input_watts).state : 0.0f;
      const float wout      = have_flow ? id(output_watts).state : 0.0f;
      const float net       = win - wout;

      // ---- top strip, 20px, identical on every page ------------------------
      // Anything that is a STATE rather than a value lives here: page name,
      // fail-safe, the inverter mark, BLE, and one icon per active mode.
      static const char *PAGES[4] = {"ENERGY", "FRIDGE", "WATER", "DIAG"};
      const int pg = id(page_idx);
      it.print(6, 4, id(f_lbl), amber(), PAGES[pg]);
      if (force)
        it.print(70, 4, id(f_lbl), bad(), "FAIL-SAFE");
      for (int i = 0; i < 4; i++)
        it.filled_circle(148 + 8 * i, 10, 2, i == pg ? amber() : faint());

      int ix = 300;
      if (parked)     ac_symbol(it, ix, 2, 16, water(), true);
      else if (ac_on) ac_symbol(it, ix, 2, 16, force ? bad() : amber(), false);
      else            ac_symbol(it, ix, 2, 16, dim(), true);
      ix -= 19;
      it.image(ix, 3, ble ? id(ico_bt) : id(ico_btoff), ble ? good() : bad(), bg());
      if (sleep_) { ix -= 18; it.image(ix, 3, id(ico_moon), water(), bg()); }
      if (manual) { ix -= 18; it.image(ix, 3, id(ico_pot),  good(),  bg()); }
      if (drive)  { ix -= 18; it.image(ix, 3, id(ico_car),  bad(),   bg()); }
      if (parked) { ix -= 60; pill(it, id(f_lbl), ix, 3, 54, 14, "PARKED", true, water()); }
      it.line(0, 20, 320, 20, faint());

      // =====================================================================
      if (pg == 0) {
        // ---- ENERGY: the battery on the left, the flow on the right --------
        // SOC decides whether the trip continues; net decides whether it will
        // still be true tomorrow. The two flows under net are supporting cast.
        const Color soc_col = !have_soc ? dim()
                            : soc > 40.0f ? good() : soc > 20.0f ? amber() : bad();
        arc_gauge(it, 76, 98, 64, 52, have_soc ? soc : 0.0f, soc_col, faint());
        if (have_soc)
          it.printf(76, 96, id(f_big), soc_col, TextAlign::CENTER, "%.0f%%", soc);
        else
          it.print(76, 96, id(f_big), dim(), TextAlign::CENTER, "--%");
        // In the gauge's open bottom. The P310's own estimate, so labelled as
        // time left only while draining - it is meaningless while charging.
        if (!have_flow || !id(remaining_minutes).has_state())
          it.print(76, 136, id(f_row), dim(), TextAlign::TOP_CENTER, "--");
        else if (net > 5.0f)
          it.print(76, 136, id(f_row), good(), TextAlign::TOP_CENTER, "charging");
        else
          it.printf(76, 136, id(f_row), dim(), TextAlign::TOP_CENTER, "%.1f h left",
                    id(remaining_minutes).state / 60.0f);

        const Color net_col = !have_flow ? dim()
                            : fabsf(net) < 5.0f ? dim() : net > 0 ? good() : amber();
        it.print(152, 26, id(f_lbl), dim(), "NET");
        it.print(316, 26, id(f_lbl), net_col, TextAlign::TOP_RIGHT,
                 !have_flow ? "NO DATA" : fabsf(net) < 5.0f ? "BALANCED"
                            : net > 0 ? "CHARGING" : "DRAINING");
        if (have_flow)
          it.printf(288, 40, id(f_big), net_col, TextAlign::TOP_RIGHT, "%+.0f", net);
        else
          it.print(288, 40, id(f_big), dim(), TextAlign::TOP_RIGHT, "--");
        it.print(316, 60, id(f_med), net_col, TextAlign::TOP_RIGHT, "W");

        it.line(152, 94, 316, 94, faint());
        // The input icon says WHERE the power is from: sun, or the alternator
        // / shore via the AC input. The number is the P310's total input.
        const bool alt = id(ac_input_watts).has_state() && id(ac_input_watts).state > 50.0f;
        it.image(152, 102, alt ? id(ico_alt) : id(ico_sun), win > 0 ? good() : faint(), bg());
        it.print(178, 106, id(f_lbl), dim(), alt ? "AC IN" : "SOLAR");
        it.image(152, 128, id(ico_plug), wout > 0 ? fg() : faint(), bg());
        it.print(178, 132, id(f_lbl), dim(), "LOAD");
        if (have_flow) {
          it.printf(316, 102, id(f_med), win > 0 ? good() : dim(), TextAlign::TOP_RIGHT, "%.0f W", win);
          it.printf(316, 128, id(f_med), wout > 0 ? fg() : dim(), TextAlign::TOP_RIGHT, "%.0f W", wout);
        } else {
          it.print(316, 102, id(f_med), dim(), TextAlign::TOP_RIGHT, "--");
          it.print(316, 128, id(f_med), dim(), TextAlign::TOP_RIGHT, "--");
        }

      } else if (pg == 1) {
        // ---- FRIDGE: the temperature, the verdict, and the deadband --------
        const float t      = probe ? id(fridge_temp).state : NAN;
        const float t_on   = id(num_temp_on).state;
        const float t_off  = id(num_temp_off).state;
        const float t_hard = id(num_temp_hard).state;
        // In sleep mode the ceiling IS the on-threshold, and an 8 C ceiling is
        // a food decision the automation must never make silently (section 6).
        const float ceil_c = sleep_ ? id(num_sleep_ceiling).state : t_on;

        it.image(8, 25, id(ico_snow), water(), bg());
        it.print(26, 26, id(f_lbl), dim(), "FRIDGE");
        if (id(cabin_temp).has_state())
          it.printf(312, 26, id(f_lbl), dim(), TextAlign::TOP_RIGHT, "CABIN %.1f°",
                    id(cabin_temp).state);

        if (probe) {
          const Color col = t > t_hard ? bad() : t > ceil_c ? amber() : fg();
          it.printf(6, 36, id(f_mega), col, "%.1f°C", t);
        } else {
          it.print(6, 36, id(f_mega), bad(), "--°C");
        }

        // The verdict block. The fill is the state; being a solid block next
        // to a hairline strip is what keeps it legible when colour is gone.
        // Text is blended against the fill, not against black, or 4-bit
        // glyphs grow a dark fringe on an amber ground.
        const int bx = 208, by = 36, bw = 104, bh = 58;
        const Color fill = parked ? water() : ac_on ? (force ? bad() : amber()) : faint();
        const Color txt  = (ac_on || parked) ? ink() : fg();
        const Color sub  = (ac_on || parked) ? ink() : dim();
        it.filled_rectangle(bx, by, bw, bh, fill);
        it.print(bx + bw / 2, by + 8, id(f_med), txt, TextAlign::TOP_CENTER,
                 parked ? "PARKED" : ac_on ? "AC ON" : "AC OFF", fill);
        if (parked)
          it.printf(bx + bw / 2, by + 34, id(f_row), sub, fill, TextAlign::TOP_CENTER,
                    "%.1f d", id(arbiter)->parked_for_s() / 86400.0f);
        else
          it.print(bx + bw / 2, by + 34, id(f_row), sub, TextAlign::TOP_CENTER,
                   ac_on ? id(arbiter)->reason() : "idle", fill);

        // The deadband strip: not "4.6 C" but "4.6 C, and this far from the
        // next run". Zones: satisfied / hysteresis gap / cooling wanted / the
        // 10 C hard override. Full width, 0-12 C.
        const int sx = 8, sy = 106, sw = 304, sh = 16;
        auto pos = [&](float v) {
          if (v < 0.0f) v = 0.0f;
          if (v > 12.0f) v = 12.0f;
          return sx + (int) (v / 12.0f * sw);
        };
        const int x_off = pos(t_off), x_hard = pos(t_hard);
        const int x_on = std::max(pos(ceil_c), x_off);
        it.filled_rectangle(sx, sy, x_off - sx, sh, Color(0x12, 0x3a, 0x4a));
        it.filled_rectangle(x_off, sy, x_on - x_off, sh, Color(0x2b, 0x2f, 0x28));
        it.filled_rectangle(x_on, sy, x_hard - x_on, sh, Color(0x5a, 0x3a, 0x12));
        it.filled_rectangle(x_hard, sy, sx + sw - x_hard, sh, Color(0x4a, 0x1a, 0x14));
        it.rectangle(sx, sy, sw, sh, faint());
        if (probe)
          it.filled_rectangle(pos(t) - 2, sy - 4, 4, sh + 8, fg());
        it.printf(x_off, sy + sh + 3, id(f_lbl), dim(), TextAlign::TOP_CENTER, "%.0f", t_off);
        it.printf(x_on, sy + sh + 3, id(f_lbl), sleep_ ? water() : dim(), TextAlign::TOP_CENTER,
                  "%.0f", ceil_c);
        it.printf(x_hard, sy + sh + 3, id(f_lbl), bad(), TextAlign::TOP_CENTER, "%.0f", t_hard);

        // One line of context: which mode owns the fridge right now.
        const int cy = 148;
        if (parked) {
          it.print(8, cy, id(f_row), water(), "Parked: fridge off on purpose");
        } else if (id(arbiter)->park_pending()) {
          // Armed but not committed. Says what is about to happen while there
          // is still time to change your mind - the arm lapses on its own.
          it.print(8, cy, id(f_row), bad(), "PARK? confirm to disarm fail-safe");
        } else if (manual) {
          it.image(8, cy + 1, id(ico_pot), good(), bg());
          it.printf(28, cy, id(f_row), good(), "manual - %u min left",
                    (unsigned) (id(arbiter)->manual_remaining_s() / 60));
        } else if (sleep_) {
          it.image(8, cy + 1, id(ico_moon), water(), bg());
          it.printf(28, cy, id(f_row), water(), "sleep - coasting up to %.1f°", ceil_c);
        } else if (drive) {
          it.image(8, cy + 1, id(ico_car), bad(), bg());
          it.print(28, cy, id(f_row), dim(), "drive inhibit - coasting");
        } else if (id(arbiter)->fridge_req()) {
          it.printf(8, cy, id(f_row), amber(), "cooling to %.1f°", t_off);
        } else {
          it.printf(8, cy, id(f_row), dim(), "satisfied - cools again above %.1f°", ceil_c);
        }

      } else if (pg == 2) {
        // ---- WATER ---------------------------------------------------------
        // van-water is Phase 2 and has no entity yet. The page is laid out for
        // the node's ABSENCE, which stays a normal state even once it exists:
        // a separate box that may simply be unpowered, never a fault.
        // HOOK: a `water_pct` sensor polled over REST replaces these two.
        const bool  up  = false;
        const float pct = 0.0f;
        const Color col = up ? water() : faint();
        const int tx = 8, ty = 28, tw = 48, th = 120;
        it.rectangle(tx, ty, tw, th, col);
        for (int i = 1; i < 4; i++)
          it.line(tx, ty + th * i / 4, tx + 7, ty + th * i / 4, faint());
        if (up) {
          const int fh = (int) ((th - 4) * pct / 100.0f);
          it.filled_rectangle(tx + 2, ty + th - 2 - fh, tw - 4, fh, water());
        }
        it.image(70, 27, id(ico_drop), col, bg());
        it.print(88, 28, id(f_lbl), dim(), "FRESH WATER");
        if (up) {
          const int litres = (int) (pct * 0.7f);
          it.printf(70, 42, id(f_mega), fg(), "%d L", litres);
          it.printf(70, 104, id(f_row), dim(), "of 70 L - %.0f%%", pct);
          // 12 L/day is an ASSUMPTION; the line says so rather than letting a
          // bare number imply it was measured.
          it.printf(70, 124, id(f_row), dim(), "~%.1f days at 12 L/day", litres / 12.0f);
        } else {
          it.print(70, 42, id(f_mega), dim(), "-- L");
          it.print(70, 104, id(f_row), dim(), "van-water not installed");
          it.print(70, 124, id(f_row), faint(), "Phase 2 - tank sender on ADS1115");
        }

      } else {
        // ---- DIAGNOSTICS ---------------------------------------------------
        // DELIBERATELY DENSE. A walk-up page read at 30cm while debugging, so
        // distance legibility is not its job and one-idea-per-page is waived.
        const int y0 = 27, dy = 19;
        auto row = [&](int col, int r, const char *k, Color vc, const char *v) {
          const int kx = col ? 168 : 8, vx = col ? 312 : 152;
          it.print(kx, y0 + r * dy, id(f_row), dim(), k);
          it.print(vx, y0 + r * dy, id(f_row), vc, TextAlign::TOP_RIGHT, v);
        };
        char b[32];

        row(0, 0, "BLE",   ble   ? fg() : bad(), ble   ? "up" : "DOWN");
        row(0, 1, "probe", probe ? fg() : bad(), probe ? "ok" : "STALE");
        if (id(fridge_temp_raw).has_state())
          snprintf(b, sizeof b, "%.2f°", id(fridge_temp_raw).state);
        else
          snprintf(b, sizeof b, "--");
        row(0, 2, "fridge raw", fg(), b);
        if (id(cabin_temp).has_state())
          snprintf(b, sizeof b, "%.1f°", id(cabin_temp).state);
        else
          snprintf(b, sizeof b, "--");
        row(0, 3, "cabin", fg(), b);
        snprintf(b, sizeof b, "%uh %02um", (unsigned) (millis() / 3600000UL),
                 (unsigned) ((millis() / 60000UL) % 60U));
        row(0, 4, "uptime", fg(), b);
        row(0, 5, "reason", fg(), id(arbiter)->reason());

        // SoftAP address is fixed by ESPHome; mDNS is unreliable on SoftAP so
        // this is the address to type, not a hostname.
        row(1, 0, "AP", fg(), "192.168.4.1");
        snprintf(b, sizeof b, "%u kB", (unsigned) (esp_get_free_heap_size() / 1024));
        row(1, 1, "heap", fg(), b);
        snprintf(b, sizeof b, "F%d M%d S%d X%d P%d",
                 id(arbiter)->fridge_req(), id(arbiter)->manual_req(),
                 id(arbiter)->surplus_req(), id(arbiter)->force_on(), id(arbiter)->parked());
        row(1, 2, "flags", fg(), b);
        row(1, 3, "sleep", sleep_ ? water() : dim(), sleep_ ? "on" : "off");
        row(1, 4, "drive inh.", drive ? bad() : dim(), drive ? "on" : "off");
        if (id(p310_charge_max).has_state())
          snprintf(b, sizeof b, "%.0f%%", id(p310_charge_max).state);
        else
          snprintf(b, sizeof b, "--");
        row(1, 5, "charge cap", fg(), b);
      }
