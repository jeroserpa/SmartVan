# van-fridge-plug-test - the fridge plug for the unattended test day
# (van-core-test.yaml). van-fridge-plug.yaml with ONE change: van-core may
# switch the relay OFF, on a lease.
#
# Why: the idle measurement needs the inverter ON with nothing drawing, and
# nobody will be in the van to pull the fridge plug.
#
# Fail direction is still ON, now enforced by time rather than by a 30s
# re-assert:
#   - boot / AC restored          -> relay ON (restore_mode + on_boot)
#   - relay OFF                   -> back ON after `lease` (4h) whatever
#                                    van-core does, including nothing at all
#   - van-core dead or unreachable -> the lease still expires
# There is no path that holds the fridge off for longer than one lease,
# except van-core deliberately re-sending OFF, which it does only inside the
# night idle phases.
#
# The relay is an ordinary web_server switch named "Fridge relay":
#   POST http://192.168.4.12/switch/Fridge%20relay/turn_off
# Button still inert. REFLASH van-heater.yaml BEFORE A HEATER GOES ON THIS PLUG.

substitutions:
  node_name: van-fridge-plug
  friendly_name: Fridge plug
  pin_relay: GPIO5
  pin_button: GPIO3
  pin_led: GPIO6
  pin_cse7766_rx: GPIO20

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "TEST DAY: fridge meter, relay OFF only on a 4h lease. Reflash van-heater.yaml before heater use."
  min_version: 2025.7.0
  on_boot:
    # Before wifi, before anything that could fail: power the fridge.
    priority: 800
    then:
      - switch.turn_on: relay

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

packages:
  base: !include ../common/base.yaml

logger:
  level: INFO
  baud_rate: 0

preferences:
  flash_write_interval: 5min

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: 192.168.4.12
        gateway: 192.168.4.1
        subnet: 255.255.255.0
    - ssid: !secret home_ssid
      password: !secret home_password
  ap:
    ssid: "${node_name}-setup"
    password: !secret wifi_password

uart:
  id: uart_cse7766
  rx_pin: ${pin_cse7766_rx}
  baud_rate: 4800
  data_bits: 8
  stop_bits: 1
  parity: EVEN

switch:
  - platform: gpio
    id: relay
    name: "Fridge relay"
    pin: ${pin_relay}
    restore_mode: ALWAYS_ON
    on_turn_off:
      - logger.log:
          level: WARN
          format: "fridge plug: relay OFF on request, lease 4h"
      - script.execute: lease
    on_turn_on:
      - script.stop: lease

script:
  # The lease. Restarted by every OFF, cancelled by ON, and nothing else can
  # stop it: whatever happens to van-core, the fridge is back within 4h.
  - id: lease
    mode: restart
    then:
      - delay: 4h
      - logger.log:
          level: WARN
          format: "fridge plug: lease expired, relay back ON"
      - switch.turn_on: relay

binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button (inert)"
    entity_category: diagnostic
    # Logged, never acted on.
    filters:
      - delayed_on_off: 20ms

sensor:
  - platform: cse7766
    id: cse7766_meter
    current:
      name: "Fridge current"
      filters:
        - throttle_average: 10s
    voltage:
      name: "Fridge voltage"
      filters:
        - throttle_average: 10s
    power:
      # Names without the device prefix: van-core fetches these by name
      # (/sensor/Fridge%20power), so they must not change.
      name: "Fridge power"
      id: power_sensor
      filters:
        - throttle_average: 10s
    power_factor:
      name: "Fridge power factor"
      filters:
        - throttle_average: 10s

  # Cumulative and flash-backed, so fridge Wh survive both a plug reboot and
  # gaps in van-core's polling. The daily figure is a difference of two rows.
  - platform: integration
    name: "Fridge energy"
    id: energy_total
    sensor: power_sensor
    time_unit: h
    unit_of_measurement: kWh
    accuracy_decimals: 4
    restore: true
    filters:
      - multiply: 0.001

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

light:
  - platform: status_led
    name: "Status LED"
    disabled_by_default: true
    pin:
      number: ${pin_led}
      inverted: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
