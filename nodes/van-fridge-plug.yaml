# van-fridge-plug - the Athom heater plug, temporarily re-purposed as a
# fridge power meter for soak #2 (van-core-probes.yaml).
#
# Same hardware as van-heater.yaml, OPPOSITE fail-safe direction. The heater
# fails OFF; a plug in the fridge's supply must fail ON (CLAUDE.md 5.2), or
# the meter becomes the thing that spoils the food. Everything in
# van-heater.yaml that can open the relay is removed here, not just disabled:
#   - restore_mode ALWAYS_OFF          -> ALWAYS_ON, and re-asserted every 30s
#   - the max-on-time script           -> gone (it would cut the fridge at 45 min)
#   - the side button toggling relay   -> gone (a knock would kill the fridge)
#   - the 12 A overcurrent trip        -> gone (the fridge draws <1 A; a real
#                                         fault is the P310's to clear)
#   - the relay switch entity          -> internal: no web toggle to mis-tap
#
# Same IP (.12) and same networks as van-heater: it is the same device.
# BEFORE PUTTING THE HEATER BACK ON IT, REFLASH van-heater.yaml. This
# firmware on a heater is an unattended 2 kW load with no runtime limit.
#
# Metering only works while the inverter is on, which for this soak is always.
# The plug's own draw (~0.5-1 W) is on the P310's output but not in its
# reading: out_w - fridge_w with nothing else plugged in measures it.

substitutions:
  node_name: van-fridge-plug
  friendly_name: Fridge plug
  pin_relay: GPIO5
  pin_button: GPIO3
  pin_led: GPIO6
  pin_cse7766_rx: GPIO20

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "SOAK ONLY: fridge meter, relay locked ON. Reflash van-heater.yaml before heater use."
  min_version: 2025.7.0
  on_boot:
    # Before wifi, before anything that could fail: power the fridge.
    priority: 800
    then:
      - switch.turn_on: relay

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

packages:
  base: !include ../common/base.yaml

logger:
  level: INFO
  baud_rate: 0

preferences:
  flash_write_interval: 5min

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        # .13, not .12: CLAUDE.md section 4 assigns .12 to van-heater, which
        # also hardcoded it. Both plugs claiming one address only shows up as
        # a fault the first time they are powered together - and then as an
        # intermittent one, which is the worst kind to chase in a van.
        static_ip: 192.168.4.13
        gateway: 192.168.4.1
        subnet: 255.255.255.0
    - ssid: !secret home_ssid
      password: !secret home_password
  ap:
    ssid: "${node_name}-setup"
    password: !secret wifi_password

uart:
  id: uart_cse7766
  rx_pin: ${pin_cse7766_rx}
  baud_rate: 4800
  data_bits: 8
  stop_bits: 1
  parity: EVEN

switch:
  - platform: gpio
    id: relay
    pin: ${pin_relay}
    internal: true
    restore_mode: ALWAYS_ON

interval:
  # Belt and braces: nothing in this config turns the relay off, but a relay
  # that is only ever *commanded* on is one bug away from staying off.
  - interval: 30s
    then:
      - if:
          condition:
            switch.is_off: relay
          then:
            - logger.log:
                level: ERROR
                format: "fridge plug: relay found OFF, forcing ON"
            - switch.turn_on: relay

binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button (inert)"
    entity_category: diagnostic
    # Logged, never acted on.
    filters:
      - delayed_on_off: 20ms

sensor:
  - platform: cse7766
    id: cse7766_meter
    current:
      name: "Fridge current"
      filters:
        - throttle_average: 10s
    voltage:
      name: "Fridge voltage"
      filters:
        - throttle_average: 10s
    power:
      # Names without the device prefix: van-core fetches these by name
      # (/sensor/Fridge%20power), so they must not change.
      name: "Fridge power"
      id: power_sensor
      filters:
        - throttle_average: 10s
    power_factor:
      name: "Fridge power factor"
      filters:
        - throttle_average: 10s

  # Cumulative and flash-backed, so fridge Wh survive both a plug reboot and
  # gaps in van-core's polling. The daily figure is a difference of two rows.
  - platform: integration
    name: "Fridge energy"
    id: energy_total
    sensor: power_sensor
    time_unit: h
    unit_of_measurement: kWh
    accuracy_decimals: 4
    restore: true
    filters:
      - multiply: 0.001

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

light:
  - platform: status_led
    name: "Status LED"
    disabled_by_default: true
    pin:
      number: ${pin_led}
      inverted: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
