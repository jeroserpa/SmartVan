# van-core-test - the unattended test day. WATER IN THE FRIDGE, NOT FOOD.
#
# van-core-probes.yaml (same probes, plug, PSRAM log) plus the production
# ac_arbiter as the single writer of the P310's AC switch, plus a sequencer
# (components/van_test) that steers the arbiter through every test that needs
# the inverter commanded, with nobody in the van. The plug must run
# van-fridge-plug-test.yaml, whose relay van-core may switch off on a 4 h lease.
#
# THE SEQUENCE (each step's verdict lands in "Test results"; every CSV row
# carries the step number):
#
#   0  ready             settle 2 min; BLE, probe, AC readback, plug all live
#   1  cmd off           park -> station reports AC off           (<= 90 s)
#   2  cmd off hold      10 min: AC stays off, socket really dead (plug unreachable)
#   3  cmd on            un-park -> station reports AC on          (<= 120 s)
#   4  fridge restart    fridge draws > 10 W again                 (<= 30 min)
#   5  plug off          relay off, fridge at 0 W                  (<= 90 s)
#   6  plug off hold     10 min
#   7  plug on           relay back on                             (<= 90 s)
#   8  fs reboot arm     arbiter releases AC (not parked: fail-safes armed), 2 min
#   9  fs reboot verify  node reboots itself; AC on again          (<= 180 s from boot)
#  10  fs ble arm        AC off again, 1 min
#  11  fs ble drop       BLE client disabled 3 min; at 2 min a reason for AC
#                        appears (profile HOLD_ON) while the link is down
#  12  fs ble verify     link back (<= 120 s), then AC on (<= 30 s: the
#                        reconnect re-write, not the 60 s re-assert)
#  13  fs probe arm      AC off again, 1 min
#  14  fs probe stale    fridge probe poller stopped -> AC on, reason
#                        "probe stale"                             (<= 9 min)
#  15  day normal        the production scheduler, defaults, until dark:
#                        station input < 3 W for 30 min (no RTC to trust)
#  16  night ac on 1     3 h    AC on, fridge unplugged by the plug relay
#  17  night ac off      4.5 h  parked: AC off
#  18  night ac on 2     2.5 h  AC on, fridge unplugged
#  19  recovery          fridge back on, AC on, until its thermostat stops
#                        (>= 90 min) or 5 h
#  20  ab continuous 1   2 h    AC on, fridge on its own thermostat
#  21  ab cycle 30/30    4 h    imposed 30 min on / 30 min off
#  22  ab continuous 2   2 h
#  23  done              production scheduler (arbiter defaults) indefinitely
#
# Roughly 1.5 h of checks, the rest of the afternoon on the real scheduler,
# ~10 h of night, then ~10-13 h of recovery and A/B: done late tomorrow.
#
# WHAT EACH BLOCK MEASURES
#   16-18  Inverter idle vs station base. Station overhead = SOC slope x
#          3900 Wh - out_w, in each phase. AC-on minus AC-off = inverter idle
#          (the ~11 W break-even in CLAUDE.md section 1). ON-OFF-ON so a drift
#          shows up as ON1 != ON2 instead of biasing the answer. Needs NO solar
#          and NO charging: T_NIGHT fails if input exceeded 5 W at any point.
#          CAVEAT, UNVERIFIED: a BMS coulomb counter can have a dead band at
#          very low current. If the AC-off phase shows almost no SOC ticks, that
#          is "below the counter's resolution", not "zero".
#   17-19  With the fridge unpowered from dusk, the whole night is a coast
#          (section 8.5): cabinet + a KNOWN water mass against the cabin probe
#          gives UA and heat capacity. Write down the litres of water.
#   19     Pulldown energy of a known mass from ~cabin temperature.
#   20-22  The pulldown penalty (the number the whole saving rests on):
#          fridge Wh per hour, continuous vs 30/30, fridge_kwh column, with the
#          cabinet start/end temperatures to correct for stored cold.
#
# SAFETY WHILE NOBODY IS THERE
#   - Never touches DC or USB (not even declared) or the charge thresholds.
#   - Plug relay OFF is a 4 h lease on the plug itself; it comes back ON
#     whatever this node does.
#   - SOC < 20 % -> test aborted, production scheduler runs.
#   - Fault injections are undone on entry to every step, so no timeout, skip
#     or abort can leave BLE disabled or the probe silent.
#   - A reboot resumes the step it interrupted; more than three unexpected
#     reboots abort the test.
#   - After done/abort: if the station disagrees with the arbiter for 10 min
#     with the link up, the node reboots (max 3).
#   - HOLD_OFF and CYCLE raise the 10 C hard override out of reach. That is
#     what makes the fail-safe and A/B steps deterministic, and it is only
#     acceptable with water in the cabinet.
#
# BEFORE FLASHING
#   1. Download the current soak log. The new column list changes the layout,
#      so the PSRAM log is discarded on first boot.
#   2. Flash the plug with van-fridge-plug-test.yaml (OTA, 192.168.4.12).
#   3. Flash this, open /soak once from the phone to set the clock.
#   4. Water bottles in, door closed, probe on the side wall as before.
# Web UI buttons: "Test: skip step", "Test: abort", "Test: restart from the
# beginning". Progress survives reboots; "restart" is the only reset.

substitutions:
  node_name: van-core-test
  friendly_name: Van core
  p310_mac: "E8:06:90:C7:AD:F6"
  pin_onewire: GPIO4
  plug_ip: "192.168.4.12"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "TEST DAY: unattended arbiter, fail-safe and idle tests. Water in the fridge, not food."
  min_version: 2025.7.0
  includes:
    - soak_includes.h

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  # Must be false: the noinit PSRAM section the log lives in is incompatible
  # with "boot without PSRAM" (IDF Kconfig SPIRAM_IGNORE_NOTFOUND).
  ignore_not_found: false

packages:
  base: !include ../common/base.yaml

external_components:
  - source: github://ylianst/esp-fbot
    refresh: 1d
  - source:
      type: local
      path: ../components
    components: [soak_log, ac_arbiter, van_test]

wifi:
  ap:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
  # captive_portal deliberately absent - see van-core-soak.yaml.

# Kept from van-core-soak.yaml, and load-bearing: the defaulted 100 % scan
# window starves the SoftAP handshake (M9, M10).
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms

ble_client:
  - mac_address: ${p310_mac}
    id: p310_ble

fbot:
  id: p310
  polling_interval: 5s
  settings_polling_interval: 60s
  poll_timeout: 15s
  max_poll_failures: 3

# -----------------------------------------------------------------------------
# 1-Wire: both probes on GPIO4, 3-wire mode, 4.7k to 3V3 at this end.
# -----------------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: ${pin_onewire}
    id: bus_1w

# -----------------------------------------------------------------------------
# Display, backlight blanked after 2 min (M12: re-measure die temperature the
# way the real node runs). "Display on" in the web UI wakes it.
# -----------------------------------------------------------------------------
spi:
  clk_pin: GPIO40
  mosi_pin: GPIO45

font:
  - file: "gfonts://Roboto"
    id: font_med
    size: 20
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

display:
  - platform: st7789v
    id: van_display
    model: Custom
    width: 172
    height: 320
    offset_width: 34
    offset_height: 0
    rotation: 90
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    update_interval: 2s
    lambda: |-
      // Where the test is and whether it is going well, readable at a glance
      // through the van window.
      auto f = [](sensor::Sensor *s) { return s->has_state() ? s->state : NAN; };
      auto *t = id(vtest);
      uint32_t el = t->step_elapsed_s(), pl = t->step_planned_s();
      it.printf(4, 0, id(font_med), "%s", t->step_name());
      if (pl) it.printf(4, 24, id(font_small), "%u / %u min", (unsigned) (el / 60), (unsigned) (pl / 60));
      else it.printf(4, 24, id(font_small), "%u min", (unsigned) (el / 60));
      it.printf(4, 42, id(font_med), "PASS %u  FAIL %u", t->passes(), t->fails());
      it.printf(4, 68, id(font_small), "AC %s (%s)  %s", id(p310_ac_active).state ? "ON" : "off",
                id(arbiter)->reason(), id(p310_connected).state ? "BLE" : "BLE DOWN");
      it.printf(4, 86, id(font_small), "in %.1f  cab %.1f C  fridge %.0f W", f(id(t_fridge)), f(id(t_cabin)),
                f(id(fridge_w)));
      it.printf(4, 104, id(font_small), "SOC %.1f%%  rows %u  clock %s", f(id(soc)), (unsigned) id(soak)->rows(),
                id(soak)->clock_state() ? "ok" : "NOT SET");
      it.printf(4, 122, id(font_small), "192.168.4.1/soak");

output:
  - platform: ledc
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    id: out_backlight
    frequency: 20000Hz

light:
  - platform: monochromatic
    output: out_backlight
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      - script.execute: blank_later

script:
  - id: blank_later
    mode: restart
    then:
      - delay: 2min
      - light.turn_off: backlight

button:
  - platform: template
    name: "Display on"
    on_press:
      - light.turn_on: backlight
  - platform: template
    name: "Test: skip step"
    on_press:
      - lambda: id(vtest)->skip_step();
  - platform: template
    # Stops testing and runs the production scheduler (or AC on continuously
    # if the command path itself failed). Plug back ON, BLE and probe restored.
    name: "Test: abort"
    on_press:
      - lambda: id(vtest)->abort_test();
  - platform: template
    # Clears every verdict and starts again from "ready".
    name: "Test: restart from the beginning"
    on_press:
      - lambda: id(vtest)->restart_test();

# The P310 inverter. SINGLE WRITER (section 5.3): only ac_arbiter writes it;
# van_test steers the arbiter, never the switch. Internal, so there is no web
# toggle to fight the test with. DC and USB are deliberately not declared: the
# habitation bus and this node hang off DC.
switch:
  - platform: fbot
    fbot_id: p310
    ac:
      name: "P310 AC inverter"
      id: ac_switch
      internal: true

# -----------------------------------------------------------------------------
# The production arbiter, unmodified. Same wiring as van-core.yaml.
# -----------------------------------------------------------------------------
ac_arbiter:
  id: arbiter
  update_interval: 5s
  fridge_temperature: t_fridge
  output_power: out_w
  cabin_temperature: t_cabin
  input_power: in_w
  battery_level: soc
  ble_connected: p310_connected
  ac_switch: ac_switch
  sensor_max_age: 45s
  link_stale: 60s

# -----------------------------------------------------------------------------
# The sequencer. Step table and reasoning: components/van_test/.
# -----------------------------------------------------------------------------
van_test:
  id: vtest
  arbiter: arbiter
  ac_active: p310_ac_active
  ble_connected: p310_connected
  ble_client: p310_ble
  fridge_probe: t_fridge
  fridge_power: fridge_w
  input_power: in_w
  battery_level: soc
  plug_url: "http://${plug_ip}"
  plug_relay: "Fridge relay"

# -----------------------------------------------------------------------------
# Instrumentation globals
# -----------------------------------------------------------------------------
globals:
  - id: ble_drops
    type: uint32_t
    initial_value: "0"
  - id: ble_down_since
    type: uint32_t
    initial_value: "0"
  - id: ble_longest_gap_s
    type: uint32_t
    initial_value: "0"
  # M12 gap: the wait for the FIRST connection after boot was never timed,
  # and that is the section 5.2 recovery path.
  - id: ble_first_connect_s
    type: float
    initial_value: "NAN"

binary_sensor:
  - platform: fbot
    fbot_id: p310
    connected:
      name: "P310 connected"
      id: p310_connected
      on_press:
        - lambda: |-
            // First connection since boot: time it once.
            if (std::isnan(id(ble_first_connect_s)))
              id(ble_first_connect_s) = millis() / 1000.0f;
            // Reconnect: close out the gap being timed.
            if (id(ble_down_since) != 0) {
              uint32_t gap = (millis() - id(ble_down_since)) / 1000;
              if (gap > id(ble_longest_gap_s)) id(ble_longest_gap_s) = gap;
              id(ble_down_since) = 0;
            }
      on_release:
        - lambda: |-
            id(ble_drops)++;
            id(ble_down_since) = millis();
    ac_active:
      name: "P310 AC output active"
      id: p310_ac_active

sensor:
  # --- the station, read-only ---
  - platform: fbot
    fbot_id: p310
    battery_level:
      name: "Battery"
      id: soc
    input_power:
      name: "Input power"
      id: in_w
    output_power:
      name: "Output power"
      id: out_w
    system_power:
      # Reg 21: AC input voltage x0.1, not a power (M11). Logged because it
      # marks alternator/shore charging unambiguously.
      name: "AC input voltage x0.1 (reg 21)"
      id: reg21
    ac_input_power:
      name: "AC input power"
      id: ac_in_w
    total_power:
      # Reg 20: AC output only (M1). out_w - ac_out_w is the 12 V + USB load,
      # and ac_out_w - fridge_w cross-checks the plug.
      name: "AC output power"
      id: ac_out_w
    dc_input_power:
      name: "Solar input power"
      id: dc_in_w

  # --- probes. Raw: no EMA, no timeout. This is a dataset, not a control
  # input, and the filters are one of the things it exists to design.
  # Pinned by address (M14): bus index 0 was 0xf50e..., the probe that read
  # 5-8 C inside the fridge.
  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0xf50e250267176c28
    name: "Fridge probe"
    id: t_fridge
    update_interval: 10s
    accuracy_decimals: 2
  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0x600e2502e02beb28
    name: "Cabin probe"
    id: t_cabin
    update_interval: 10s
    accuracy_decimals: 2

  # --- diagnostics ---
  - platform: template
    name: "BLE disconnect count"
    id: s_ble_drops
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(ble_drops);
  - platform: template
    name: "Longest BLE gap"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(ble_longest_gap_s);
  - platform: template
    name: "BLE first connect after boot"
    id: s_ble_first
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: return id(ble_first_connect_s);
  - platform: template
    # Internal RAM only - where the BLE stack lives. M12's "free heap" was
    # PSRAM-dominated and could not have shown a leak here.
    name: "Free internal heap"
    id: heap_int
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
  - platform: template
    name: "Min free internal heap"
    id: heap_int_min
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL);
  - platform: template
    name: "Largest internal block"
    id: heap_int_block
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);
  - platform: template
    name: "SoftAP clients"
    id: ap_clients
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      wifi_sta_list_t l;
      if (esp_wifi_ap_get_sta_list(&l) != ESP_OK) return NAN;
      return l.num;
  - platform: template
    name: "Test step"
    id: s_step
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(vtest)->step();
  - platform: template
    # AcReason as a number for the CSV: 0 off, 1 parked, 2 boot, 3 ble lost,
    # 4 link stale, 5 probe stale, 6 watchdog, 7 fridge hard, 8 fridge,
    # 9 manual, 10 surplus.
    name: "Arbiter reason code"
    id: s_reason
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      static const char *const R[] = {"off", "parked", "boot", "ble lost", "link stale", "probe stale",
                                      "watchdog", "fridge (hard)", "fridge", "manual", "surplus"};
      for (int i = 0; i < 11; i++)
        if (strcmp(id(arbiter)->reason(), R[i]) == 0) return i;
      return NAN;
  - platform: template
    name: "Arbiter wants AC"
    id: s_ac_cmd
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return (float) id(arbiter)->ac_on();
  - platform: template
    name: "Arbiter force_on"
    id: s_force_on
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return (float) id(arbiter)->force_on();
  - platform: template
    name: "Arbiter fridge_req"
    id: s_fridge_req
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return (float) id(arbiter)->fridge_req();
  - platform: template
    name: "Arbiter parked"
    id: s_parked
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return (float) id(arbiter)->parked();
  - platform: template
    name: "Plug relay"
    id: s_plug_relay
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(vtest)->plug_relay();
  - platform: template
    name: "BLE client enabled"
    id: s_ble_en
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return (float) id(vtest)->ble_enabled();
  - platform: template
    name: "Backlight on"
    id: bl_on
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return id(backlight).remote_values.is_on() ? 1.0f : 0.0f;

text_sensor:
  - platform: template
    name: "Test step name"
    update_interval: 10s
    lambda: |-
      char b[64];
      uint32_t pl = id(vtest)->step_planned_s();
      snprintf(b, sizeof(b), "%s  %u/%u min", id(vtest)->step_name(),
               (unsigned) (id(vtest)->step_elapsed_s() / 60), (unsigned) (pl / 60));
      return std::string(b);
  - platform: template
    # One entry per check: P pass, F fail, S skipped, - not run. Values are
    # seconds for latencies; see the Test enum in van_test.h for the rest.
    name: "Test results"
    update_interval: 30s
    lambda: return id(vtest)->results();
  - platform: template
    name: "Arbiter reason"
    update_interval: 10s
    lambda: return std::string(id(arbiter)->reason());
  - platform: template
    # Both addresses, in index order. Write them down; the real node pins
    # probes by address, never by index.
    name: "1-Wire devices"
    id: probe_ids
    update_interval: 60s
    lambda: |-
      std::string s;
      char b[24];
      for (uint64_t a : id(bus_1w)->get_devices()) {
        snprintf(b, sizeof(b), "%s0x%016llx", s.empty() ? "" : " ", (unsigned long long) a);
        s += b;
      }
      return s.empty() ? std::string("NONE FOUND") : s;

# -----------------------------------------------------------------------------
# The log. 10 s rows of 96 bytes (21 columns): 4 MB holds ~4.8 days.
# -----------------------------------------------------------------------------
soak_log:
  id: soak
  # The Android app opens /ui: land it on the log page. Stock entities stay at /.
  serve_at_ui: true
  interval: 10s
  buffer_size: 4000000
  remote:
    # The Athom plug between the P310 and the fridge, flashed with
    # nodes/van-fridge-plug.yaml. Polled off the main loop.
    - url: "http://${plug_ip}/sensor/Fridge%20power"
      sensor:
        name: "Fridge power (plug)"
        id: fridge_w
        unit_of_measurement: "W"
        accuracy_decimals: 1
    - url: "http://${plug_ip}/sensor/Fridge%20energy"
      sensor:
        name: "Fridge energy (plug)"
        id: fridge_kwh
        unit_of_measurement: "kWh"
        accuracy_decimals: 4
  columns:
    - {name: t_fridge, sensor: t_fridge, accuracy_decimals: 3}
    - {name: t_cabin, sensor: t_cabin, accuracy_decimals: 3}
    - {name: fridge_w, sensor: fridge_w, accuracy_decimals: 1}
    - {name: fridge_kwh, sensor: fridge_kwh, accuracy_decimals: 4}
    - {name: soc, sensor: soc, accuracy_decimals: 1}
    - {name: in_w, sensor: in_w, accuracy_decimals: 0}
    - {name: out_w, sensor: out_w, accuracy_decimals: 0}
    - {name: ac_in_w, sensor: ac_in_w, accuracy_decimals: 0}
    - {name: dc_in_w, sensor: dc_in_w, accuracy_decimals: 0}
    - {name: reg21, sensor: reg21, accuracy_decimals: 0}
    - {name: ac_on, binary_sensor: p310_ac_active}
    - {name: ble_up, binary_sensor: p310_connected}
    - {name: ble_drops, sensor: s_ble_drops, accuracy_decimals: 0}
    - {name: ble_first_s, sensor: s_ble_first, accuracy_decimals: 1}
    - {name: heap_int, sensor: heap_int, accuracy_decimals: 0}
    - {name: heap_int_min, sensor: heap_int_min, accuracy_decimals: 0}
    - {name: heap_int_blk, sensor: heap_int_block, accuracy_decimals: 0}
    - {name: die_c, sensor: board_temp, accuracy_decimals: 1}
    - {name: ap_clients, sensor: ap_clients, accuracy_decimals: 0}
    - {name: backlight, sensor: bl_on, accuracy_decimals: 0}
    - {name: ac_out_w, sensor: ac_out_w, accuracy_decimals: 0}
    # --- test day: which step every row belongs to, and what the arbiter
    # was doing about it ---
    - {name: step, sensor: s_step, accuracy_decimals: 0}
    - {name: reason, sensor: s_reason, accuracy_decimals: 0}
    - {name: ac_cmd, sensor: s_ac_cmd, accuracy_decimals: 0}
    - {name: force_on, sensor: s_force_on, accuracy_decimals: 0}
    - {name: fridge_req, sensor: s_fridge_req, accuracy_decimals: 0}
    - {name: parked, sensor: s_parked, accuracy_decimals: 0}
    - {name: plug_relay, sensor: s_plug_relay, accuracy_decimals: 0}
    - {name: ble_en, sensor: s_ble_en, accuracy_decimals: 0}
